--bad:#ff8f80;--badbg:#401c18;color-scheme:dark}\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Figtree,system-ui,sans-serif;min-height:100%}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--ln)}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}\nh1{font:800 26px/1.1 \"Bricolage Grotesque\",Figtree,sans-serif;margin:0 0 10px;letter-spacing:-.01em}\nh1 span{color:var(--ac)}\n.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}\n.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 14px;font:600 14px Figtree,sans-serif;cursor:pointer;text-decoration:none}\n.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}\na.chip{color:var(--ac);border-color:var(--ac)}\ninput:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}\nmain{max-width:900px;margin:0 auto;padding:16px}\n.lt{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:0 0 14px}\n.lt summary{padding:12px 14px;cursor:pointer;font-weight:600}.lt summary span{color:var(--ac)}\n.lb{padding:0 14px 14px;display:grid;gap:10px}\n.lb label{display:grid;gap:4px;font-weight:600;font-size:14px}\nselect,input[type=number],input[type=date]{padding:9px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;width:100%;min-width:0}\n.lb p,.mu{margin:0;color:var(--mu);font-size:13px}\n.dm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.dm input{text-align:center}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}\n.vol{font:800 18px \"Bricolage Grotesque\",Figtree,sans-serif;color:var(--tx)}.vol b{color:var(--ac)}\n.ph{margin:0 0 16px}\n.ph h3{font:800 17px \"Bricolage Grotesque\",Figtree,sans-serif;margin:0 0 6px}\n.ph .w{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px 10px}\n.ph table{width:100%;border-collapse:collapse;font-size:14px}\n.ph th,.ph td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}\n.ph tr:last-child td{border-bottom:0}\n.ph th{color:var(--mu);font-weight:600}\n.ph td:first-child{font-weight:600}\n.ph td input,.ph td select{width:96px;padding:6px 8px}\n.ph td select{width:74px}\n.sr{display:flex;gap:6px;align-items:center}\n.ph td input.xt{border:2px solid var(--bad);background:var(--badbg)}\n.ph p{color:var(--mu);font-size:13px;margin:8px 0 0}\n.badge{font-weight:700;font-size:14px}\n.badge.ok{color:var(--ok)}.badge.low,.st.low{color:var(--low)}.badge.high,.st.high{color:var(--high)}\n.badge.ext{color:var(--bad);background:var(--badbg);border:1px solid var(--bad);border-radius:99px;padding:1px 10px}\n.st{font-weight:700}.st.ext{color:var(--bad)}\n.row{display:flex;gap:10px;margin:12px 0 0}\n.btn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:600 15px Figtree,sans-serif;cursor:pointer}\n.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}\n.btn.s{flex:none;padding:3px 10px;font-weight:400;font-size:13px}\n.rec{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:10px 14px;margin:0 0 10px}\n.rec.bad{border-left-color:var(--bad);background:var(--badbg)}.rec.ok{border-left-color:var(--ok)}\n.rec b{font:600 15px/1.25 \"Bricolage Grotesque\",Figtree,sans-serif;display:block}\n.rec p{margin:4px 0 0}\n.scroll{overflow-x:auto}\nfooter{color:var(--mu);font-size:13px;text-align:center;padding:24px 16px 32px}\n.le{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin:0 0 8px}\n.lh{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}\n.lg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 8px}\n.lg span{display:flex;flex-direction:column;font-weight:600;font-size:15px;min-width:0}\n.lg i{font-style:normal;font-weight:400;font-size:11px;color:var(--mu);white-space:nowrap}\n@media (min-width:720px){.lg{grid-template-columns:repeat(10,minmax(0,1fr))}}\n[hidden]{display:none!important}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\n\u003ca href=\"index.html\" style=\"display:inline-block;margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ac);text-decoration:none\">← Reef Tools home\u003c/a>\n\u003ch1>Reef \u003cspan>Water\u003c/span> Tracker\u003c/h1>\n\u003cdiv class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Coral group\">\u003c/div>\n\u003c/header>\n\u003cmain>\n\u003cdetails class=\"lt\" id=\"tk\" open>\u003csummary>My tank: \u003cspan id=\"tsum\">\u003c/span>\u003c/summary>\u003cdiv class=\"lb\">\n\u003clabel>Tank size\u003cselect id=\"pre\">\u003c/select>\u003c/label>\n\u003cdiv class=\"dm\">\u003clabel>Length (cm)\u003cinput id=\"L\" type=\"number\" min=\"20\" max=\"300\">\u003c/label>\u003clabel>Width (cm)\u003cinput id=\"W\" type=\"number\" min=\"20\" max=\"200\">\u003c/label>\u003clabel>Depth (cm)\u003cinput id=\"H\" type=\"number\" min=\"20\" max=\"120\">\u003c/label>\u003c/div>\n\u003cdiv class=\"two\">\u003clabel>Sump or extra water (litres)\u003cinput id=\"sump\" type=\"number\" min=\"0\" value=\"0\">\u003c/label>\u003clabel>Or enter total litres (optional)\u003cinput id=\"lit\" type=\"number\" min=\"1\" placeholder=\"Overrides the size above\">\u003c/label>\u003c/div>\n\u003cp class=\"vol\" id=\"vol\">\u003c/p>\n\u003cp>Working volume is an estimate. It uses a flat 10% allowance for rock and sand and does not account for the water actually displaced by your rock, substrate and equipment. If you know your real system volume, enter it as total litres. Your tank settings are saved on this device. Choose the coral group above to match your tank. Ranges come from the Reef Coral Guide.\u003c/p>\u003c/div>\u003c/details>\n\n\u003cdiv class=\"ph\">\u003ch3>Tank parameters\u003c/h3>\n\u003clabel class=\"mu\" style=\"display:flex;gap:10px;align-items:center;margin:0 0 8px\">Test date\u003cinput id=\"dt\" type=\"date\" style=\"width:auto\">\u003c/label>\n\u003cp class=\"mu\" id=\"ln\" style=\"margin:0 0 8px\">\u003c/p>\n\u003cdiv class=\"w\">\u003ctable>\u003ctr>\u003cth>Parameter\u003c/th>\u003cth>Your reading\u003c/th>\u003cth>Ideal\u003c/th>\u003cth>Tolerated\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cspan id=\"gn\">\u003c/span>Ideal is where to aim. Tolerated is what the coral can survive for short periods, so a reading outside it is flagged as very low or very high. Stability matters more than hitting exact numbers: avoid swings in alkalinity of more than 1 dKH per day, and in temperature of more than 1 °C per day.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn p\" id=\"save\" type=\"button\">Save to log\u003c/button>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"ph\">\u003ch3>What to do, in order of priority\u003c/h3>\u003cdiv id=\"out\">\u003c/div>\u003c/div>\n\n\u003cdetails class=\"lt\">\u003csummary>My log\u003c/summary>\u003cdiv class=\"lb\">\u003cdiv class=\"scroll\" id=\"log\">\u003c/div>\u003cp>Saved on this device only. With two or more entries, the tracker estimates how fast alkalinity, calcium and magnesium are used.\u003c/p>\u003c/div>\u003c/details>\n\u003c/main>\n\u003cfooter>Guidelines only. Dose amounts are the pure-chemical equivalents; for commercial products follow the label. Change parameters slowly, retest after each adjustment, and confirm odd readings with a second test kit. SG and ppt are converted at about 25 °C (1.025 SG is roughly 34 ppt).\u003cbr>© 2026 Peter Ede\u003c/footer>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst GURL='reef-coral-guide.html';\nconst K=.00074,s2p=g=>(g-1)/K;\nconst P=[{k:'sal',n:'Salinity',u:'ppt'},{k:'temp',n:'Temperature',u:'°C',s:.1},{k:'ph',n:'pH',u:'',s:.01},{k:'alk',n:'Alkalinity',u:'dKH',s:.1},{k:'ca',n:'Calcium',u:'ppm',s:1},{k:'mg',n:'Magnesium',u:'ppm',s:5},{k:'no3',n:'Nitrate',u:'ppm',s:.5},{k:'po4',n:'Phosphate',u:'ppm',s:.01},{k:'nh3',n:'Ammonia',u:'ppm',s:.01},{k:'no2',n:'Nitrite',u:'ppm',s:.01}];\nconst N={nh3:[0,.05,0,.1],no2:[0,.05,0,.1]};\n// [ideal low, ideal high, tolerated low, tolerated high] (Soft, LPS, SPS from the Reef Coral Guide)\nconst R={\nsoft:{...N,temp:[24,26,22,28],sal:[34,35,s2p(1.023),s2p(1.027)],ph:[8.1,8.3,7.9,8.4],alk:[7,9,6,11],ca:[400,440,380,460],mg:[1280,1380,1200,1420],no3:[2,10,.5,20],po4:[.03,.1,.01,.2]},\nlps:{...N,temp:[24,26,23,28],sal:[34,35,s2p(1.024),s2p(1.027)],ph:[8.1,8.3,8,8.4],alk:[7,9,6.5,10],ca:[400,450,380,470],mg:[1280,1380,1250,1420],no3:[2,10,1,15],po4:[.03,.1,.02,.15]},\nsps:{...N,temp:[25,26,24,27],sal:[34,35,s2p(1.024),s2p(1.026)],ph:[8.1,8.3,8,8.4],alk:[7,8.5,7,9],ca:[420,450,400,470],mg:[1300,1400,1280,1420],no3:[1,5,.5,10],po4:[.01,.05,.005,.1]},\nmixed:{...N,temp:[25,26,24,27],sal:[34,35,s2p(1.024),s2p(1.026)],ph:[8.1,8.3,8,8.4],alk:[7,8.5,7,9],ca:[420,440,400,460],mg:[1300,1380,1280,1420],no3:[2,5,1,10],po4:[.03,.05,.02,.1]},\nfowlr:{...N,temp:[24,27,23,28],sal:[34,35,s2p(1.023),s2p(1.027)],ph:[8.1,8.4,8,8.5],alk:[7,11,6,12],ca:[380,450,350,480],mg:[1250,1400,1200,1450],no3:[0,20,0,40],po4:[0,.2,0,.5]}};\nconst G=[['mixed','Mixed reef'],['soft','Soft corals'],['lps','LPS'],['sps','SPS'],['fowlr','Fish only']];\nconst TK=[[\"30 × 30 × 30 cm nano cube\",30,30,30],[\"45 × 45 × 45 cm cube\",45,45,45],[\"60 × 45 × 45 cm\",60,45,45],[\"90 × 45 × 45 cm\",90,45,45],[\"120 × 50 × 50 cm\",120,50,50],[\"4 × 2 × 2 ft (122 × 61 × 61 cm)\",122,61,61],[\"5 × 2 × 2 ft (152 × 61 × 61 cm)\",152,61,61],[\"6 × 2 × 2 ft (183 × 61 × 61 cm)\",183,61,61],[\"6 × 3 × 2.5 ft (183 × 91 × 76 cm)\",183,91,76],[\"8 × 3 × 2.5 ft (244 × 91 × 76 cm)\",244,91,76]];\nconst F={alk:.030,ca:.00367,mg:.00836},M={alk:1,ca:20,mg:50};\nconst CH={alk:'sodium bicarbonate (food or lab grade)',ca:'calcium chloride dihydrate (food or lab grade)',mg:'magnesium chloride hexahydrate (food or lab grade)'};\nlet D=[122,61,61],LOG=[],SU='ppt',GP='sps';\ntry{LOG=JSON.parse(localStorage.getItem('reef-log')||'[]')}catch(e){LOG=[]}\nconst sf=v=>SU==='sg'?(1+v*K).toFixed(3):String(+v.toFixed(1));\nconst toP=v=>SU==='sg'?s2p(v):v;\nconst sd=d=>SU==='sg'?(d*K).toFixed(3)+' SG':d.toFixed(1)+' ppt';\nconst un=p=>p.k==='sal'?(SU==='sg'?'SG':'ppt'):p.u;\nconst rg=(p,a,b)=>p.k==='sal'?sf(a)+'–'+sf(b)+' '+un(p):a+'–'+b+(p.u?' '+p.u:'');\nconst f=g=>g>=1000?(g/1000).toFixed(2)+' kg':g>=10?g.toFixed(0)+' g':g.toFixed(1)+' g';\n\n$('chips').innerHTML=G.map(g=>`\u003cbutton class=\"chip\" type=\"button\" data-g=\"${g[0]}\" aria-pressed=\"false\">${g[1]}\u003c/button>`).join('')+'\u003ca class=\"chip\" id=\"gl\" data-x target=\"_blank\" rel=\"noopener\">Coral Guide\u003c/a>';\n$('pre').innerHTML='\u003coption value=\"-1\">Custom size\u003c/option>'+TK.map((p,i)=>`\u003coption value=\"${i}\">${p[0]}\u003c/option>`).join('');\n$('rows').innerHTML=P.map(p=>`\u003ctr>\u003ctd>${p.n}\u003c/td>\u003ctd>${p.k==='sal'?'\u003cspan class=\"sr\">\u003cinput type=\"number\" step=\"0.1\" id=\"i_sal\" aria-label=\"Salinity\">\u003cselect id=\"su\" aria-label=\"Salinity unit\">\u003coption value=\"ppt\">ppt\u003c/option>\u003coption value=\"sg\">SG\u003c/option>\u003c/select>\u003c/span>':`\u003cspan class=\"sr\">\u003cinput type=\"number\" step=\"${p.s}\" id=\"i_${p.k}\" aria-label=\"${p.n}\">${p.u?'\u003cspan class=\"mu\">'+p.u+'\u003c/span>':''}\u003c/span>`}\u003c/td>\u003ctd id=\"ri_${p.k}\">\u003c/td>\u003ctd id=\"rt_${p.k}\">\u003c/td>\u003ctd>\u003cspan class=\"badge\" id=\"b_${p.k}\">\u003c/span>\u003c/td>\u003c/tr>`).join('');\n$('dt').value=new Date().toISOString().slice(0,10);\n\nfunction showDims(){['L','W','H'].forEach((id,i)=>$(id).value=D[i])}\nfunction syncPre(){let t=-1;TK.forEach((x,n)=>{if(x[1]==D[0]&&x[2]==D[1]&&x[3]==D[2])t=n});$('pre').value=t}\nfunction dimCh(fromPre){if(fromPre&&+$('pre').value>=0){const q=TK[+$('pre').value];D=[q[1],q[2],q[3]];showDims()}else{D=['L','W','H'].map((id,i)=>Math.max(20,+$(id).value||[60,45,45][i]));syncPre()}update()}\nfunction vol(){const l=parseFloat($('lit').value);if(l>0)return l;return D[0]*D[1]*D[2]/1000*.9+(parseFloat($('sump').value)||0)}\nfunction ranges(){P.forEach(p=>{const r=R[GP][p.k],z=p.k==='nh3'||p.k==='no2';$('ri_'+p.k).textContent=z?'0':rg(p,r[0],r[1]);$('rt_'+p.k).textContent=z?'under 0.1 ppm':rg(p,r[2],r[3])});\n document.querySelectorAll('.chip[data-g]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===GP));\n const nf=GP==='fowlr'||GP==='mixed';$('gl').href=GURL+(nf?'':'#'+GP);$('gl').textContent=nf?'Coral Guide':'See '+G.find(g=>g[0]===GP)[1]+' in the Guide';$('gn').textContent=GP==='mixed'?'Mixed reef uses the narrowest overlap of the Soft, LPS and SPS ranges, so every coral group is covered. ':''}\n\nfunction dose(k,d,V){const days=Math.max(1,Math.ceil(d/M[k]-1e-9)),tot=d*V*F[k];return{days,tot,per:tot/days}}\nfunction split(k,d,V,u){const o=dose(k,d,V);return `Raise by ${d.toFixed(k==='alk'?1:0)} ${u}. Dissolve about ${f(o.tot)} of ${CH[k]} in total, added over ${o.days} day${o.days>1?'s':''} (${f(o.per)} per day, never more than +${M[k]} ${u} per day). Retest 24 hours after each dose.`}\n\nfunction rec(p,x,s,V,ex){\n const k=p.k,r=R[GP][k],id=(r[0]+r[1])/2;let c='ac',m='';\n const fx=v=>k==='sal'?sf(v):v,u=k==='sal'?(SU==='sg'?' SG':' ppt'):(p.u?' '+p.u:'');\n if(k==='sal'){if(s==='low')m=`Raise by ${sd(id-x)}: mix in about ${f((id-x)*V)} of salt (check your brand’s instructions), no more than ${sd(1)} per day.`;else m=`Lower by ${sd(x-id)}: remove about ${(V*(x-id)/x).toFixed(0)} L and replace with RODI water, no more than ${sd(1)} per day. Top up evaporation with RODI only.`}\n else if(k==='temp')m=s==='low'?'Check heater size and thermostat. Raise gradually, no more than 1 °C per day.':'Improve cooling: a fan across the surface, lid ventilation, or a chiller. Check pumps and lights for extra heat.';\n else if(k==='ph')m=s==='low'?'Low pH is usually low alkalinity or high indoor CO₂. Ventilate the room, run the skimmer on fresh air, and confirm alkalinity is in range.':'High pH can follow overdosing alkalinity or kalkwasser. Pause dosing and retest.';\n else if(k==='alk'||k==='ca'||k==='mg'){\n  if(s==='low')m=split(k,id-x,V,p.u)+(k==='mg'?' Fix magnesium first; low magnesium stops calcium and alkalinity from holding.':' Dose alkalinity and calcium on separate days or in separate parts of the tank. If magnesium is also low, fix that first.');\n  else{m=`Pause ${p.n.toLowerCase()} dosing until it falls back into range.`;if(ex)m+=' It’s outside what corals tolerate, so also do a 20% water change.'}}\n else if(k==='no3')m=s==='high'?`Do a ${Math.min(30,Math.max(10,Math.round((1-id/x)*100)))}% water change (about ${(V*Math.min(30,Math.max(10,Math.round((1-id/x)*100)))/100).toFixed(0)} L) and repeat weekly until in range. Also review feeding, skimmer performance and filter socks, and consider carbon.`:'Nitrate is low for corals. Feed a little more or add fish food; corals can pale when nitrate and phosphate both bottom out.';\n else if(k==='po4')m=s==='high'?'Do a 15–20% water change and use phosphate-removing media (GFO) in a reactor. Lower slowly, no faster than about 0.05 ppm per day, to avoid shocking corals.':'Phosphate is low. Feed a little more and ease off GFO, carbon or heavy skimming.';\n else m='Toxic to fish and corals. Do a 25–30% water change now, check for dead livestock or overfeeding, and confirm the biofilter is healthy. Consider an ammonia detoxifier while you fix it.';\n if(k==='nh3'||k==='no2')ex=true;\n return{k,ex,c:ex?'bad':c,t:`${ex?'⚠ ':''}${p.n}: ${fx(x)}${u} \u003cspan class=\"st ${ex?'ext':s}\">${ex&&k!=='nh3'&&k!=='no2'?'Very ':''}${s==='low'?'Low':'High'}\u003c/span> (ideal ${fx(r[0])}–${fx(r[1])})`,m}}\n\nfunction maint(k,x,V){\n const dt=$('dt').value,prev=LOG.filter(e=>e.d\u003cdt&&e.v[k]!=null).sort((a,b)=>b.d.localeCompare(a.d))[0];\n if(!prev)return null;const days=(new Date(dt)-new Date(prev.d))/864e5;if(days\u003c.5)return null;\n const c=(prev.v[k]-x)/days;if(c\u003c=0)return null;const p=P.find(q=>q.k===k);\n return `${p.n}: dropping about ${c.toFixed(k==='alk'?2:1)} ${p.u} per day since ${prev.d}. Maintenance dose is roughly ${f(c*V*F[k])} of ${CH[k]} per day, split into several small doses or a dosing pump. This assumes you added nothing in between; if you did, real use is higher.`}\n\nfunction update(){\n const V=vol(),val={},recs=[];\n $('vol').innerHTML=`Working volume: \u003cb>${V.toFixed(0)} L\u003c/b> (about ${(V/3.785).toFixed(0)} US gal)`;\n $('tsum').textContent=V.toFixed(0)+' L, '+G.find(g=>g[0]===GP)[1];\n P.forEach(p=>{const e=$('i_'+p.k).value;val[p.k]=e===''?null:parseFloat(e)});\n if(val.sal!=null)val.sal=toP(val.sal);\n P.forEach(p=>{const x=val[p.k],r=R[GP][p.k],b=$('b_'+p.k),inp=$('i_'+p.k);\n  if(x==null||isNaN(x)){b.textContent='';b.className='badge';inp.classList.remove('xt');return}\n  const s=x\u003cr[0]?'low':x>r[1]?'high':'ok',ex=s!=='ok'&&(x\u003cr[2]||x>r[3]);\n  inp.classList.toggle('xt',ex);\n  b.textContent=s==='ok'?'In range':(ex?'Very ':'')+(s==='low'?'low':'high');\n  b.className='badge '+(s==='ok'?'ok':ex?'ext':s);\n  if(s!=='ok'){const o=rec(p,x,s,V,ex);o.sev=(x\u003cr[0]?r[0]-x:x-r[1])/((r[3]-r[2])||1);recs.push(o)}});\n const RK=['nh3','no2','temp','sal','mg','alk','ca','ph','no3','po4'],tier=o=>o.k==='nh3'||o.k==='no2'?0:o.ex?1:2;\n recs.sort((a,b)=>tier(a)-tier(b)||RK.indexOf(a.k)-RK.indexOf(b.k));\n const mt=['alk','ca','mg'].filter(k=>val[k]!=null).map(k=>maint(k,val[k],V)).filter(Boolean);\n let h='';\n if(!P.some(p=>val[p.k]!=null))h='\u003cp class=\"mu\">Enter at least one test result to see what to add, how much and how often.\u003c/p>';\n else{h=recs.map((r,i)=>`\u003cdiv class=\"rec ${r.c==='bad'?'bad':''}\">\u003cb>${i+1}. ${r.t}\u003c/b>\u003cp>${r.m}\u003c/p>\u003c/div>`).join('');\n  if(!recs.length)h='\u003cdiv class=\"rec ok\">\u003cb>Everything you entered is in the ideal range.\u003c/b>\u003cp>Keep up your routine and retest on schedule.\u003c/p>\u003c/div>';\n  if(mt.length)h+='\u003ch3 style=\"margin-top:16px\">How often to dose\u003c/h3>'+mt.map(m=>`\u003cdiv class=\"rec\">\u003cp>${m}\u003c/p>\u003c/div>`).join('');\n  else if(['alk','ca','mg'].some(k=>val[k]!=null))h+='\u003cp class=\"mu\">Save this reading, then test again in 3 to 7 days. Once there are two entries, I’ll estimate your daily consumption and a maintenance dose.\u003c/p>';\n  h+='\u003cp class=\"mu\" style=\"margin-top:10px\">Suggested testing: temperature daily; salinity, alkalinity, calcium and nitrate weekly; magnesium and phosphate every two weeks; ammonia and nitrite after any livestock loss or new additions.\u003c/p>'}\n $('out').innerHTML=h;saveTank()}\n\nfunction renderLog(){\n if(!LOG.length){$('log').innerHTML='\u003cp class=\"mu\">No saved readings yet. Fill in your results and select Save to log.\u003c/p>';return}\n const ab={sal:'Sal',temp:'Temp',ph:'pH',alk:'Alk',ca:'Ca',mg:'Mg',no3:'NO₃',po4:'PO₄',nh3:'NH₃',no2:'NO₂'};\n $('log').innerHTML=[...LOG].sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`\u003cdiv class=\"le\">\u003cdiv class=\"lh\">\u003cb>${e.d}\u003c/b>\u003cbutton class=\"btn s\" data-d=\"${e.d}\" aria-label=\"Delete entry ${e.d}\">Delete\u003c/button>\u003c/div>\u003cdiv class=\"lg\">${P.map(q=>`\u003cspan title=\"${q.n}\">\u003ci>${ab[q.k]}${q.k==='sal'?' ('+(SU==='sg'?'SG':'ppt')+')':''}\u003c/i>${e.v[q.k]==null?'–':q.k==='sal'?sf(e.v[q.k]):e.v[q.k]}\u003c/span>`).join('')}\u003c/div>\u003c/div>`).join('')}\nfunction persist(){try{localStorage.setItem('reef-log',JSON.stringify(LOG))}catch(e){}}\nfunction saveTank(){try{localStorage.setItem('reef-tank',JSON.stringify({D,sump:$('sump').value,lit:$('lit').value,su:SU,gp:GP}))}catch(e){}}\nfunction loadTank(){try{const t=JSON.parse(localStorage.getItem('reef-tank')||'null');if(!t)return;\n if(Array.isArray(t.D)&&t.D.length===3&&t.D.every(v=>v>0))D=t.D;\n  $('sump').value=t.sump??0;$('lit').value=t.lit??'';\n if(R[t.gp])GP=t.gp;\n if(t.su==='sg'){SU='sg';$('su').value='sg';$('i_sal').step=.001}}catch(e){}}\n\n$('pre').onchange=()=>dimCh(true);\n['L','W','H'].forEach(id=>$(id).oninput=()=>dimCh(false));\n$('su').onchange=()=>{const e=$('i_sal'),old=SU,v=parseFloat(e.value);SU=$('su').value;e.step=SU==='sg'?.001:.1;if(!isNaN(v)){const q=old==='sg'?s2p(v):v;e.value=SU==='sg'?(1+q*K).toFixed(3):q.toFixed(1)}ranges();update();renderLog()};\n$('chips').onclick=e=>{const g=e.target.dataset&&e.target.dataset.g;if(g){GP=g;ranges();update()}};\n['sump','lit','dt',...P.map(p=>'i_'+p.k)].forEach(id=>$(id).oninput=update);\n$('save').onclick=()=>{const v={};P.forEach(p=>{const e=$('i_'+p.k).value;if(e!=='')v[p.k]=p.k==='sal'?+toP(parseFloat(e)).toFixed(1):parseFloat(e)});\n if(!Object.keys(v).length)return;LOG=LOG.filter(e=>e.d!==$('dt').value);LOG.push({d:$('dt').value,v});persist();renderLog();update()};\n$('log').onclick=e=>{const d=e.target.dataset.d;if(d){LOG=LOG.filter(x=>x.d!==d);persist();renderLog();update()}};\nfunction loadLast(){const e=[...LOG].sort((a,b)=>b.d.localeCompare(a.d))[0];if(!e)return;P.forEach(p=>{const v=e.v[p.k];if(v!=null)$('i_'+p.k).value=p.k==='sal'?sf(v):v});$('ln').textContent='Showing your last saved readings from '+e.d+'. Change them to enter new results.'}\nloadTank();\nconst hh=location.hash.slice(1).toLowerCase();if(R[hh])GP=hh;\nshowDims();syncPre();ranges();renderLog();loadLast();update();\nP.forEach(p=>$('i_'+p.k).addEventListener('input',()=>{$('ln').textContent=''}));\ndocument.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[data-x]');if(a&&window.top===window.self)a.removeAttribute('target')},true);\n\u003c/script>\u003cscript>window.__live=function(){var v={};['sal','ph','alk','ca','mg'].forEach(function(k){var e=document.getElementById('i_'+k);v[k]=e?e.value:''});return{gp:GP,su:SU,vol:vol(),v:v}}\u003c/script>\u003c/body>\u003c/html>\n", "chemistry": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cbase href=\"about:srcdoc\">\u003cscript>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var m=(a.getAttribute('href')||'').match(/^(index|how-to-use|reef-water-tracker|reef-water-chemistry|reef-coral-guide)\\.html(#.*)?$/i);if(m){e.preventDefault();parent.postMessage({reefGo:m[1].toLowerCase(),hash:m[2]||''},'*')}},true)\u003c/script>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"author\" content=\"Peter Ede\">\n\u003cmeta name=\"description\" content=\"How calcium, magnesium, alkalinity, salinity and pH interact in a reef tank, with dose calculators for common products.\">\n\u003cmeta name=\"theme-color\" content=\"#eaf6f8\" media=\"(prefers-color-scheme: light)\">\n\u003cmeta name=\"theme-color\" content=\"#08162b\" media=\"(prefers-color-scheme: dark)\">\n\u003clink rel=\"icon\" href=\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b2540'/%3E%3Cg%20stroke='%23ff6fae'%20stroke-width='6'%20stroke-linecap='round'%20fill='none'%3E%3Cpath%20d='M32%2054V30M32%2040L18%2026M32%2036L46%2020M18%2026V16M46%2020V12'/%3E%3C/g%3E%3C/svg%3E\">\n\u003ctitle>Reef Water Chemistry\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#eaf6f8;--sf:#fff;--tx:#0b2540;--mu:#51708f;--ac:#d6226f;--ln:#c4dce3;--ok:#17703f;--low:#1c5fb0;--high:#b5540a;--bad:#a8281b;--badbg:#fbe3df;color-scheme:light}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#08162b;--sf:#0f2444;--tx:#e6f1ff;--mu:#8fa8c7;--ac:#ff6fae;--ln:#1d3a63;--ok:#6fd89b;--low:#7db4ff;--high:#ffa45c;--bad:#ff8f80;--badbg:#401c18;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#08162b;--sf:#0f2444;--tx:#e6f1ff;--mu:#8fa8c7;--ac:#ff6fae;--ln:#1d3a63;--ok:#6fd89b;--low:#7db4ff;--high:#ffa45c;--bad:#ff8f80;--badbg:#401c18;color-scheme:dark}\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Figtree,system-ui,sans-serif}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--ln)}\n.back{display:inline-block;margin:0 0 6px;color:var(--ac);font-weight:600;font-size:14px;text-decoration:none}.back:hover{text-decoration:underline}\nh1{font:800 26px/1.1 \"Bricolage Grotesque\",Figtree,sans-serif;margin:0 0 10px}h1 span{color:var(--ac)}\nh2{font:800 20px/1.2 \"Bricolage Grotesque\",Figtree,sans-serif;margin:26px 0 8px}\nh3{font:600 16px/1.25 \"Bricolage Grotesque\",Figtree,sans-serif;margin:0 0 4px}\n.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}\n.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 14px;font:600 14px Figtree,sans-serif;cursor:pointer;text-decoration:none}\n.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}\na.chip{color:var(--ac);border-color:var(--ac)}\nbutton:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}\nmain{max-width:900px;margin:0 auto;padding:16px}\np{margin:0 0 8px}.mu{color:var(--mu);font-size:13px}\n.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:0 0 10px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}\n.grid .card{margin:0}\n.card b{color:var(--ac)}\n.w{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px 10px}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}\ntr:last-child td{border-bottom:0}th{color:var(--mu);font-weight:600}td:first-child{font-weight:600}\ntd input{width:100px;padding:6px 8px}\ninput,select{padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;min-width:0}\n.badge{font-weight:700}.ok{color:var(--ok)}.low{color:var(--low)}.high{color:var(--high)}\n.rec{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:14px;padding:10px 14px;margin:0 0 10px}\n.rec.bad{border-left-color:var(--bad);background:var(--badbg)}.rec.good{border-left-color:var(--ok)}\n.rec b{display:block;font:600 15px/1.25 \"Bricolage Grotesque\",Figtree,sans-serif}.rec p{margin:4px 0 0}\n.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 10px}\n.calc label{display:grid;gap:4px;font-weight:600;font-size:14px}.calc input,.calc select{width:100%}\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}\n.flow span{background:var(--bg);border:1px solid var(--ln);border-radius:99px;padding:3px 12px;font-weight:600;font-size:14px}\n.flow i{font-style:normal;color:var(--ac)}\nfooter{color:var(--mu);font-size:13px;text-align:center;padding:24px 16px 32px}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\n\u003ca class=\"back\" href=\"index.html\">← Reef Tools\u003c/a>\n\u003ch1>Reef \u003cspan>Water\u003c/span> Chemistry\u003c/h1>\n\u003cdiv class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Coral group\">\u003c/div>\n\u003c/header>\n\u003cmain>\n\u003cp>Salinity, magnesium, alkalinity (dKH), calcium and pH are linked. Fix them in the wrong order and the numbers drift back or the chemistry crashes out as white powder. This page explains how they interact, checks your readings and works out doses.\u003c/p>\n\u003cdiv class=\"chips\" style=\"margin:0 0 8px\">\u003ca class=\"chip\" href=\"reef-water-tracker.html\">Reef Water Tracker (log and history) →\u003c/a>\u003ca class=\"chip\" href=\"reef-coral-guide.html\">Reef Coral Guide →\u003c/a>\u003c/div>\n\n\u003ch2>1. Check my water\u003c/h2>\n\u003cp class=\"mu\" id=\"trk\" style=\"margin:0 0 8px\">\u003c/p>\n\u003cp style=\"margin:0 0 8px\">\u003cbutton class=\"chip\" id=\"trkb\" type=\"button\">Fill from Reef Water Tracker\u003c/button> \u003cbutton class=\"chip\" id=\"trkf\" type=\"button\">Load from Tracker backup file\u003c/button>\u003cinput id=\"trki\" type=\"file\" accept=\".json,.csv,.txt,application/json,text/csv\" hidden>\u003c/p>\n\u003cdiv class=\"w\">\u003ctable>\u003ctr>\u003cth>Parameter\u003c/th>\u003cth>Your reading\u003c/th>\u003cth>Ideal (\u003cspan id=\"gn\">\u003c/span>)\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\u003ctbody id=\"rows\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"mu\" style=\"margin-top:8px\">Ranges are the ideal values from the Reef Coral Guide for the group chosen above. Natural seawater is about 35 ppt, 420 ppm calcium, 1290 ppm magnesium and 6.5–7 dKH.\u003c/p>\n\u003ch3 style=\"margin-top:14px\">What to do, in order\u003c/h3>\n\u003cdiv id=\"out\">\u003c/div>\n\n\u003ch2>2. How they interact\u003c/h2>\n\u003cdiv class=\"card\">\u003ch3>The fix-it order\u003c/h3>\n\u003cdiv class=\"flow\">\u003cspan>Salinity\u003c/span>\u003ci>→\u003c/i>\u003cspan>Magnesium\u003c/span>\u003ci>→\u003c/i>\u003cspan>Alkalinity\u003c/span>\u003ci>→\u003c/i>\u003cspan>Calcium\u003c/span>\u003ci>→\u003c/i>\u003cspan>pH\u003c/span>\u003c/div>\n\u003cp class=\"mu\">Each step makes the next one hold. Don’t chase calcium or alkalinity while salinity or magnesium is off.\u003c/p>\u003c/div>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch3>Salinity: the baseline\u003c/h3>\u003cp>Calcium, magnesium and alkalinity are all concentrations, so they rise and fall with salinity. A tank at 38 ppt reads high on everything; one at 30 ppt reads low. Test salinity first and calibrate your refractometer with 35 ppt (1.026 SG) fluid.\u003c/p>\u003cp>Evaporation removes only water, so top up with RODI and never salt water. Keep swings small: under 1 ppt (about 0.001 SG) per day.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Magnesium: the stabiliser\u003c/h3>\u003cp>Magnesium keeps calcium and carbonate dissolved. When it is low (below about 1250 ppm), calcium and alkalinity precipitate onto heaters, pumps and glass, so they drop even after you dose and never hold.\u003c/p>\u003cp>Ideal is roughly three times your calcium (a Mg:Ca ratio near 3:1). It is used slowly, so it needs dosing far less often.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Alkalinity (dKH): the buffer\u003c/h3>\u003cp>Alkalinity is the carbonate and bicarbonate that holds pH steady and that corals use to build skeletons. It is the fastest-consumed parameter in a stony-coral tank and the one that swings most. Avoid changes of more than 1 dKH a day.\u003c/p>\u003cp>Higher alkalinity raises pH; low alkalinity lets pH fall and wobble overnight.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Calcium: the building block\u003c/h3>\u003cp>Corals take up calcium and alkalinity together, in a fixed ratio: about \u003cb>1 dKH for every 7 ppm of calcium\u003c/b>. If you dose them in that ratio, both stay steady. If one drifts away from the other, dose just the one that is lagging.\u003c/p>\u003cp>Calcium alone barely moves pH, but pushing calcium and alkalinity both high at once is what triggers precipitation.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>pH: the result\u003c/h3>\u003cp>pH is mostly an outcome, not a dial. It is set by alkalinity, plus the CO₂ in your room air. Low pH with good alkalinity usually means high CO₂: ventilate the room or run the skimmer from outside air. High pH after dosing means too much alkalinity or kalkwasser too quickly.\u003c/p>\u003cp>It normally dips at night when lights are off, so test at the same time each day.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>The precipitation trap\u003c/h3>\u003cp>Seawater is close to saturated with calcium carbonate. High calcium plus high alkalinity plus low magnesium plus warm water is the recipe for snowstorms, scaly pumps and sudden drops. Dose alkalinity and calcium separately, slowly, in well-mixed flow, and never both into the same spot at once.\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003ch2>3. Calculators: alkalinity, calcium, magnesium\u003c/h2>\n\u003cdiv class=\"card\">\u003cdiv class=\"calc\" style=\"margin:0\">\u003clabel>System litres (tank plus sump)\u003cinput id=\"cv\" type=\"number\" min=\"1\" value=\"500\">\u003c/label>\u003c/div>\n\u003cp class=\"mu\" style=\"margin:8px 0 0\">Current readings fill in from Check my water above, or you can type them here. Targets start at the middle of the ideal range for the coral group chosen at the top; change them if you like. Each calculator works out a raise (grams to add) or a lower (water change), and a daily maintenance dose if you enter how much you lose per day. Use food-grade or laboratory-grade chemicals only.\u003c/p>\u003c/div>\n\u003cdiv id=\"calcs\">\u003c/div>\n\u003cp class=\"mu\">Amounts are pure-chemical equivalents. Per litre: 0.030 g sodium bicarbonate per dKH, 0.0189 g anhydrous sodium carbonate per dKH, 3.67 mg calcium chloride dihydrate (2.77 mg anhydrous) per ppm calcium, 8.36 mg magnesium chloride hexahydrate (10.1 mg magnesium sulfate heptahydrate) per ppm magnesium. Use only food-grade or laboratory-grade chemicals, not supermarket, hardware or pool products such as baking soda, washing soda, Epsom salt or de-icer, which can contain additives or impurities. Red Sea Foundation A, B and C use the label rates: liquid, 1 mL per 100 L raises calcium 2 ppm, alkalinity 0.1 dKH or magnesium 1 ppm; powder, 1 g per 100 L raises calcium 3.6 ppm, alkalinity 0.33 dKH or magnesium 1.34 ppm. Seachem Reef Builder uses 3 g per 150 L for +0.25 meq/L (0.7 dKH), and Reef Advantage Calcium about 5 g per 150 L for +12 ppm. Always check the label on your own bottle. Maximum steps per day: 1 dKH, 20 ppm calcium, 50 ppm magnesium.\u003c/p>\n\u003ch2>4. Balance everything to my calcium\u003c/h2>\n\u003cdiv class=\"card\" id=\"bal\">\u003cp>Choose the calcium level you want to hold. Matching alkalinity and magnesium targets are worked out, then each element gets a raise or lower amount. A reading that is already inside the ideal range is left alone, and you can enter your own alkalinity and magnesium targets. Uses the system litres, products and new salt water values from section 3.\u003c/p>\n\u003cdiv class=\"calc\">\u003clabel>Calcium I want to hold (ppm)\u003cinput id=\"b_t\" type=\"number\" step=\"5\">\u003c/label>\u003clabel>Current calcium (ppm)\u003cinput id=\"bl_ca\" type=\"number\" step=\"any\">\u003c/label>\u003clabel>Current alkalinity (dKH)\u003cinput id=\"bl_alk\" type=\"number\" step=\"any\">\u003c/label>\u003clabel>Current magnesium (ppm)\u003cinput id=\"bl_mg\" type=\"number\" step=\"any\">\u003c/label>\u003clabel>Alkalinity I want (dKH, optional)\u003cinput id=\"bl_ta\" type=\"number\" step=\"any\" placeholder=\"auto\">\u003c/label>\u003clabel>Magnesium I want (ppm, optional)\u003cinput id=\"bl_tm\" type=\"number\" step=\"any\" placeholder=\"auto\">\u003c/label>\u003c/div>\n\u003cdiv id=\"bo\">\u003c/div>\n\u003cp class=\"mu\">How the targets are set: if your alkalinity or magnesium is already inside the ideal range for your coral group, it is kept as it is. Otherwise alkalinity moves to the nearest sensible point in the range, and magnesium to about 3.07 times calcium (the natural seawater ratio) kept inside the range. Anything you type in the “I want” boxes is used instead.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Keeping balanced day to day\u003c/h3>\u003cp>Test alkalinity and calcium weekly, magnesium every two weeks, salinity and temperature every day. Note how many dKH you lose per day. For every 1 dKH you replace, replace about 7 ppm of calcium. If calcium stays level while alkalinity falls, your calcium is coming from salt water changes: dose alkalinity only. Use the Reef Water Tracker to log readings and see your daily consumption.\u003c/p>\u003c/div>\n\u003c/main>\n\u003cfooter>Guidelines only. Change parameters slowly, retest after each adjustment and confirm odd readings with a second test kit. SG and ppt are converted at about 25 °C.\u003cbr>\u003ca href=\"index.html\" style=\"color:var(--ac);font-weight:600\">← Back to Reef Tools\u003c/a>\u003cbr>© 2026 Peter Ede\u003c/footer>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst K=.00074;\nconst G=[['mixed','Mixed reef'],['soft','Soft corals'],['lps','LPS'],['sps','SPS'],['fowlr','Fish only']];\n// [ideal low, ideal high] from the Reef Coral Guide\nconst R={mixed:{sal:[34,35],ph:[8.1,8.3],alk:[7,8.5],ca:[420,440],mg:[1300,1380]},soft:{sal:[34,35],ph:[8.1,8.3],alk:[7,9],ca:[400,440],mg:[1280,1380]},lps:{sal:[34,35],ph:[8.1,8.3],alk:[7,9],ca:[400,450],mg:[1280,1380]},sps:{sal:[34,35],ph:[8.1,8.3],alk:[7,8.5],ca:[420,450],mg:[1300,1400]},fowlr:{sal:[34,35],ph:[8.1,8.4],alk:[7,11],ca:[380,450],mg:[1250,1400]}};\nconst P=[{k:'sal',n:'Salinity',u:'ppt',s:.1},{k:'mg',n:'Magnesium',u:'ppm',s:5},{k:'alk',n:'Alkalinity',u:'dKH',s:.1},{k:'ca',n:'Calcium',u:'ppm',s:1},{k:'ph',n:'pH',u:'',s:.01}];\nconst F={alk:.030,ca:.00367,mg:.00836},M={alk:1,ca:20,mg:50};\nconst CH={alk:'sodium bicarbonate (food or lab grade)',ca:'calcium chloride dihydrate (food or lab grade)',mg:'magnesium chloride hexahydrate (food or lab grade)'};\nlet GP='mixed',SU='ppt';\nconst g=x=>x>=1000?(x/1000).toFixed(2)+' kg':x>=10?x.toFixed(0)+' g':x.toFixed(1)+' g';\n$('chips').innerHTML=G.map(x=>`\u003cbutton class=\"chip\" type=\"button\" data-g=\"${x[0]}\" aria-pressed=\"false\">${x[1]}\u003c/button>`).join('');\n$('rows').innerHTML=P.map(p=>`\u003ctr>\u003ctd>${p.n}\u003c/td>\u003ctd>\u003cinput type=\"number\" step=\"${p.s}\" id=\"i_${p.k}\" aria-label=\"${p.n}\"> ${p.k==='sal'?'\u003cselect id=\"su\" aria-label=\"Salinity unit\">\u003coption value=\"ppt\">ppt\u003c/option>\u003coption value=\"sg\">SG\u003c/option>\u003c/select>':`\u003cspan class=\"mu\">${p.u}\u003c/span>`}\u003c/td>\u003ctd id=\"r_${p.k}\">\u003c/td>\u003ctd>\u003cspan class=\"badge\" id=\"b_${p.k}\">\u003c/span>\u003c/td>\u003c/tr>`).join('');\nfunction dose(k,d,V){const days=Math.max(1,Math.ceil(d/M[k]-1e-9)),t=d*V*F[k];return `Add about \u003cb>${g(t)}\u003c/b> of ${CH[k]} in total, over ${days} day${days>1?'s':''} (${g(t/days)} per day). Retest 24 hours after each dose.`}\nfunction check(){\n const v={},recs=[];\n P.forEach(p=>{const e=$('i_'+p.k).value;v[p.k]=e===''?null:parseFloat(e)});\n if(v.sal!=null&&!isNaN(v.sal)&&SU==='sg'){const g=v.sal,q=R[GP].sal,lo=+(1+q[0]*K).toFixed(3),hi=+(1+q[1]*K).toFixed(3);v.sal=g>=lo-1e-9&&g\u003c=hi+1e-9?(q[0]+q[1])/2:(g-1)/K}\n const r=R[GP];\n P.forEach(p=>{const x=v[p.k],b=$('b_'+p.k),q=r[p.k];\n  if(x==null||isNaN(x)){b.textContent='';b.className='badge';return}\n  const s=x\u003cq[0]?'low':x>q[1]?'high':'ok';b.textContent=s==='ok'?'In range':s==='low'?'Low':'High';b.className='badge '+s;v['_'+p.k]=s});\n const add=(t,m,bad)=>recs.push(`\u003cdiv class=\"rec ${bad?'bad':''}\">\u003cb>${t}\u003c/b>\u003cp>${m}\u003c/p>\u003c/div>`);\n const id=k=>(r[k][0]+r[k][1])/2;\n if(v._sal==='low')add('Salinity is low','Raise it first, no more than 1 ppt (0.001 SG) per day by mixing salt water. Your other readings will rise with it, so retest them afterwards.');\n if(v._sal==='high')add('Salinity is high','Lower it first by replacing water with RODI, no more than 1 ppt (0.001 SG) per day. Calcium, magnesium and alkalinity will fall with it, so retest them afterwards.');\n if(v._mg==='low'){const d=id('mg')-v.mg,V=parseFloat($('cv').value),pr=typeof PR!=='undefined'?PR.mg.prod[+$('p_mg').value]:null;\n  const how=V>0&&pr?`To reach about ${Math.round(id('mg'))} ppm in your ${Math.round(V)} L system, add about ${amt(d*V*pr[1],pr[2])} of ${pr[0]} in total, spread over ${Math.max(1,Math.ceil(d/50-1e-9))} day${d>50?'s':''}. The magnesium calculator below has the details.`:'Use the magnesium calculator below for the amount.';\n  add('Magnesium is low: fix this before calcium or alkalinity',`Low magnesium lets calcium and alkalinity precipitate. ${how}`,true)}\n if(v._alk==='low')add('Alkalinity is low',`Raise it slowly, no more than 1 dKH per day. ${v._mg==='low'?'Do magnesium first. ':''}Use the calculator below for your tank volume.`);\n if(v._alk==='high')add('Alkalinity is high','Pause alkalinity dosing and let corals use it. Don’t raise calcium while alkalinity is high: together they cause precipitation.',v.alk>r.alk[1]+2);\n if(v._ca==='low')add('Calcium is low',`Raise it in steps of no more than 20 ppm a day, on a different day or place from alkalinity. ${v._mg==='low'?'Fix magnesium first. ':''}`);\n if(v._ca==='high')add('Calcium is high','Pause calcium dosing. Excess calcium with normal or high alkalinity risks precipitation.');\n if(v.alk!=null&&v.ca!=null&&v.alk>9&&v.ca>450)add('Precipitation risk','High calcium and high alkalinity together are close to the point where carbonate crashes out. Hold both and retest in a few days.',true);\n if(v.mg!=null&&v.ca!=null&&v.ca>0&&v.mg/v.ca\u003c2.7)add('Magnesium to calcium ratio is low',`Your ratio is ${(v.mg/v.ca).toFixed(1)}:1. Aim for about 3:1 to keep calcium dissolved.`);\n if(v._ph==='low')add('pH is low',v._alk==='low'?'Alkalinity is also low, which is the likely cause. Raise it slowly.':'If alkalinity is in range, the likely cause is CO₂ in room air. Ventilate the room and run the skimmer from outside air.');\n if(v._ph==='high')add('pH is high',v._alk==='high'?'High alkalinity is the likely cause. Pause alkalinity dosing.':'Check for overdosing of kalkwasser or alkalinity, and retest at the same time of day.');\n const any=P.some(p=>v[p.k]!=null&&!isNaN(v[p.k]));\n $('out').innerHTML=!any?'\u003cp class=\"mu\">Enter any readings you have to see what to fix first.\u003c/p>':recs.length?recs.join(''):'\u003cdiv class=\"rec good\">\u003cb>Everything you entered is in the ideal range.\u003c/b>\u003cp>Keep your routine and retest on schedule.\u003c/p>\u003c/div>';\n}\nfunction ranges(){const r=R[GP];P.forEach(p=>{const q=r[p.k];$('r_'+p.k).textContent=p.k==='sal'?(SU==='sg'?`${(1+q[0]*K).toFixed(3)}–${(1+q[1]*K).toFixed(3)} SG (${q[0]}–${q[1]} ppt)`:`${q[0]}–${q[1]} ppt (${(1+q[0]*K).toFixed(3)}–${(1+q[1]*K).toFixed(3)} SG)`):q[0]+'–'+q[1]+(p.u?' '+p.u:'')});\n document.querySelectorAll('.chip[data-g]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===GP));\n $('gn').textContent=G.find(x=>x[0]===GP)[1];check();if(typeof tgt==='function'&&$('t_alk'))tgt()}\n$('chips').onclick=e=>{const x=e.target.dataset&&e.target.dataset.g;if(x){GP=x;ranges()}};\nP.forEach(p=>$('i_'+p.k).oninput=check);\n$('su').onchange=()=>{const e=$('i_sal'),old=SU,v=parseFloat(e.value);SU=$('su').value;e.step=SU==='sg'?.001:.1;if(!isNaN(v)){const q=old==='sg'?(v-1)/K:v;e.value=SU==='sg'?(1+q*K).toFixed(3):q.toFixed(1)}ranges();check()};\nconst PR={\nalk:{n:'Alkalinity',u:'dKH',fresh:7,mx:1,prod:[['Sodium bicarbonate (food or lab grade)',.030,'g'],['Sodium carbonate, anhydrous (food or lab grade)',.0189,'g'],['Red Sea Reef Foundation B (liquid)',.1,'mL'],['Red Sea Reef Foundation B (powder)',.0303,'g'],['Seachem Reef Builder (powder)',.0286,'g']]},\nca:{n:'Calcium',u:'ppm',fresh:420,mx:20,prod:[['Calcium chloride dihydrate (food or lab grade)',.00367,'g'],['Calcium chloride anhydrous (food or lab grade)',.00277,'g'],['Red Sea Reef Foundation A (liquid)',.005,'mL'],['Red Sea Reef Foundation A (powder)',.00278,'g'],['Seachem Reef Advantage Calcium (powder)',.00278,'g']]},\nmg:{n:'Magnesium',u:'ppm',fresh:1290,mx:50,prod:[['Magnesium chloride hexahydrate (food or lab grade)',.00836,'g'],['Magnesium sulfate heptahydrate (food or lab grade)',.01014,'g'],['Red Sea Reef Foundation C (liquid)',.01,'mL'],['Red Sea Reef Foundation C (powder)',.00746,'g']]}};\nconst amt=(x,u)=>u==='mL'?(x>=1000?(x/1000).toFixed(2)+' L':x>=10?x.toFixed(0)+' mL':x.toFixed(1)+' mL'):g(x);\n$('calcs').innerHTML=Object.keys(PR).map(k=>{const q=PR[k];return `\u003cdiv class=\"card\">\u003ch3>${q.n} calculator\u003c/h3>\u003cdiv class=\"calc\">\u003clabel>Current (${q.u})\u003cinput id=\"c_${k}\" type=\"number\" step=\"any\">\u003c/label>\u003clabel>Target (${q.u})\u003cinput id=\"t_${k}\" type=\"number\" step=\"any\">\u003c/label>\u003clabel>New salt water reads\u003cinput id=\"f_${k}\" type=\"number\" step=\"any\" value=\"${q.fresh}\">\u003c/label>\u003clabel>Daily drop (optional)\u003cinput id=\"d_${k}\" type=\"number\" step=\"any\" min=\"0\" placeholder=\"${q.u} per day\">\u003c/label>${k==='mg'?'\u003clabel>My calcium (optional)\u003cinput id=\"x_mg\" type=\"number\" step=\"any\" placeholder=\"ppm\">\u003c/label>':''}\u003clabel>Product\u003cselect id=\"p_${k}\">${q.prod.map((p,i)=>`\u003coption value=\"${i}\">${p[0]}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"o_${k}\">\u003c/div>\u003c/div>`}).join('');\nfunction calcK(k){\n const q=PR[k],c=parseFloat($('c_'+k).value),t=parseFloat($('t_'+k).value),f=parseFloat($('f_'+k).value),d=parseFloat($('d_'+k).value),V=parseFloat($('cv').value),pr=q.prod[+$('p_'+k).value],o=$('o_'+k);\n if(!(V>0)){o.innerHTML='\u003cp class=\"mu\">Enter your system litres above.\u003c/p>';return}\n const per=x=>x*V*pr[1],g=x=>amt(x,pr[2]);let h='';\n if(!isNaN(c)&&!isNaN(t)){\n  if(t>c){const dd=t-c,days=Math.max(1,Math.ceil(dd/q.mx-1e-9)),tot=per(dd);\n   h+=`\u003cdiv class=\"rec good\">\u003cb>Raise ${q.n.toLowerCase()} by ${+dd.toFixed(1)} ${q.u}\u003c/b>\u003cp>Add about \u003cb>${g(tot)}\u003c/b> of ${pr[0]} in total, over ${days} day${days>1?'s':''} (${g(tot/days)} per day, never more than +${q.mx} ${q.u} per day). Dissolve in RODI water, add slowly into strong flow, and retest 24 hours after each dose.\u003c/p>\u003c/div>`;\n   if(k==='alk')h+=`\u003cp class=\"mu\">Corals will use about ${(dd*7).toFixed(0)} ppm of calcium to build with this extra alkalinity. Check calcium afterwards.\u003c/p>`;\n   if(k==='ca')h+=`\u003cp class=\"mu\">Check magnesium first: if it is low, this calcium may not hold. This raise needs about ${(dd/7).toFixed(1)} dKH of alkalinity to match when corals use it.\u003c/p>`;\n   if(k==='alk'&&pr[1]\u003c.02)h+=`\u003cp class=\"mu\">Sodium carbonate raises pH more than sodium bicarbonate. Add it in smaller, slower steps.\u003c/p>`}\n  else if(t\u003cc){\n   if(!isNaN(f)&&c>f&&t>=f){const pc=(c-t)/(c-f)*100;h+=`\u003cdiv class=\"rec\">\u003cb>Lower ${q.n.toLowerCase()} from ${c} to ${t} ${q.u}\u003c/b>\u003cp>Replace about \u003cb>${pc.toFixed(0)}%\u003c/b> of the water (about ${(V*pc/100).toFixed(0)} L) with new salt water that reads ${f}. Pause dosing.${pc>25?' That is a lot in one go: split it over several water changes a few days apart.':''}\u003c/p>\u003c/div>`}\n   else h+=`\u003cdiv class=\"rec\">\u003cb>Target is below your new salt water\u003c/b>\u003cp>A water change cannot reach it. Pause dosing and let your corals use it down, no faster than ${q.mx} ${q.u} per day.\u003c/p>\u003c/div>`}\n  else h+=`\u003cdiv class=\"rec good\">\u003cb>Already at target.\u003c/b>\u003c/div>`;\n  if(k==='mg'){const x=parseFloat($('x_mg').value);if(x>0)h+=`\u003cp class=\"mu\">At your target, magnesium to calcium is ${(t/x).toFixed(1)}:1. Aim for about 3:1.\u003c/p>`}\n }else h+='\u003cp class=\"mu\">Enter current and target readings for a raise or lower.\u003c/p>';\n if(d>0){const dm=per(d);\n  h+=`\u003cdiv class=\"rec\">\u003cb>Daily maintenance\u003c/b>\u003cp>To replace ${+d.toFixed(2)} ${q.u} per day, add about \u003cb>${g(dm)}\u003c/b> of ${pr[0]} per day (${g(dm*7)} per week), split into several small doses or run on a dosing pump. Adjust it after each test.\u003c/p>`;\n  if(k==='alk')h+=`\u003cp>To stay balanced, also replace about ${(d*7).toFixed(0)} ppm of calcium per day, which is ${amt(d*7*V*PR.ca.prod[+$('p_ca').value][1],PR.ca.prod[+$('p_ca').value][2])} of ${PR.ca.prod[+$('p_ca').value][0]}.\u003c/p>`;\n  if(k==='ca')h+=`\u003cp>To stay balanced, also replace about ${(d/7).toFixed(2)} dKH of alkalinity per day, which is ${amt(d/7*V*PR.alk.prod[+$('p_alk').value][1],PR.alk.prod[+$('p_alk').value][2])} of ${PR.alk.prod[+$('p_alk').value][0]}.\u003c/p>`;\n  h+='\u003c/div>'}\n o.innerHTML=h}\nfunction bal(){\n const V=parseFloat($('cv').value),T=parseFloat($('b_t').value),r=R[GP],o=$('bo');\n if(!(V>0)){o.innerHTML='\u003cp class=\"mu\">Enter your system litres in section 3.\u003c/p>';return}\n if(!(T>0)){o.innerHTML='\u003cp class=\"mu\">Enter the calcium level you want to hold.\u003c/p>';return}\n const cur={ca:parseFloat($('bl_ca').value),alk:parseFloat($('bl_alk').value),mg:parseFloat($('bl_mg').value)};\n if(isNaN(cur.ca)&&isNaN(cur.alk)&&isNaN(cur.mg)){o.innerHTML='\u003cp class=\"mu\">Enter at least one current reading.\u003c/p>';return}\n const cl=(x,a,b)=>Math.min(b,Math.max(a,x)),ta=parseFloat($('bl_ta').value),tm=parseFloat($('bl_tm').value),why={};\n let at,mt;\n if(ta>0){at=ta;why.alk='the target you entered'}\n else if(!isNaN(cur.alk)&&cur.alk>=r.alk[0]&&cur.alk\u003c=r.alk[1]){at=cur.alk;why.alk='your reading is already inside the ideal range, so it is left alone'}\n else if(cur.alk>r.alk[1]){at=r.alk[1];why.alk='the top of the ideal range'}\n else{at=(r.alk[0]+r.alk[1])/2;why.alk='the middle of the ideal range'}\n if(tm>0){mt=tm;why.mg='the target you entered'}\n else if(!isNaN(cur.mg)&&cur.mg>=r.mg[0]&&cur.mg\u003c=r.mg[1]&&cur.mg/T>=2.7&&cur.mg/T\u003c=3.4){mt=cur.mg;why.mg='your reading is inside the ideal range and about 3 times calcium, so it is left alone'}\n else{mt=cl(T*3.07,r.mg[0],r.mg[1]);why.mg='about 3.07 times calcium, kept inside the ideal range'}\n const tg={mg:mt,alk:at,ca:T},tol={mg:20,alk:.2,ca:5},fm=(k,x)=>k==='alk'?x.toFixed(1):x.toFixed(0);\n let h='';\n if(T\u003cr.ca[0]||T>r.ca[1])h+=`\u003cdiv class=\"rec bad\">\u003cp>${T} ppm is outside the ideal ${r.ca[0]}–${r.ca[1]} ppm for ${G.find(x=>x[0]===GP)[1].toLowerCase()}. It will still work, but check it suits your corals.\u003c/p>\u003c/div>`;\n let rows='';\n ['mg','alk','ca'].forEach(k=>{\n  const q=PR[k],c=cur[k];let a;\n  if(isNaN(c)){rows+=`\u003ctr>\u003ctd>${q.n}\u003c/td>\u003ctd>–\u003c/td>\u003ctd>${fm(k,tg[k])} ${q.u}\u003c/td>\u003ctd colspan=\"2\" class=\"mu\">Enter a current reading\u003c/td>\u003c/tr>`;return}\n  const dd=tg[k]-c;\n  if(Math.abs(dd)\u003c=tol[k])a='\u003cspan class=\"ok\">On target\u003c/span>';\n  else if(dd>0){const pr=q.prod[+$('p_'+k).value],tot=dd*V*pr[1],days=Math.max(1,Math.ceil(dd/q.mx-1e-9));a=`\u003cspan class=\"low\">Raise\u003c/span> by ${fm(k,dd)} ${q.u}: add ${amt(tot,pr[2])} of ${pr[0]} over ${days} day${days>1?'s':''} (${amt(tot/days,pr[2])} a day)`}\n  else{const f=parseFloat($('f_'+k).value);\n   if(!isNaN(f)&&c>f&&tg[k]>=f){const pc=(c-tg[k])/(c-f)*100;a=`\u003cspan class=\"high\">Lower\u003c/span> by ${fm(k,-dd)} ${q.u}: replace about ${pc.toFixed(0)}% of the water (${(V*pc/100).toFixed(0)} L)`}\n   else a=`\u003cspan class=\"high\">Lower\u003c/span> by ${fm(k,-dd)} ${q.u}: pause dosing and let corals use it down`}\n  rows+=`\u003ctr>\u003ctd>${q.n}\u003c/td>\u003ctd>${fm(k,c)} ${q.u}\u003c/td>\u003ctd>${fm(k,tg[k])} ${q.u}\u003c/td>\u003ctd>${isNaN(dd)?'':(dd>0?'+':'')+fm(k,dd)}\u003c/td>\u003ctd style=\"white-space:normal;min-width:260px\">${a}\u003c/td>\u003c/tr>`});\n h+=`\u003cdiv class=\"w\">\u003ctable>\u003ctr>\u003cth>Element\u003c/th>\u003cth>Now\u003c/th>\u003cth>Target\u003c/th>\u003cth>Change\u003c/th>\u003cth>What to do\u003c/th>\u003c/tr>${rows}\u003c/table>\u003c/div>\u003cp class=\"mu\" style=\"margin-top:8px\">Work down the table in order: magnesium first, then alkalinity, then calcium, with calcium and alkalinity on different days. A water change moves all three toward your new salt water values, so retest after each one before dosing more. To keep the balance afterwards, replace about 7 ppm of calcium for every 1 dKH of alkalinity used.\u003c/p>\u003cp class=\"mu\">Alkalinity target: ${why.alk}. Magnesium target: ${why.mg}. At ${T} ppm calcium, seawater-proportional alkalinity would be about ${(T/60).toFixed(1)} dKH, but any value inside the ideal range works.\u003c/p>`;\n o.innerHTML=h}\nfunction calcAll(){Object.keys(PR).forEach(calcK);bal();check()}\nfunction tgt(){Object.keys(PR).forEach(k=>{const q=R[GP][k],m=(q[0]+q[1])/2;if(k==='ca')$('b_t').value=Math.round(m);$('t_'+k).value=k==='alk'?+m.toFixed(1):Math.round(m)});calcAll()}\ntry{const sp=JSON.parse(localStorage.getItem('rc-prod')||'{}');Object.keys(PR).forEach(k=>{if(sp[k]!=null&&sp[k]\u003cPR[k].prod.length)$('p_'+k).value=sp[k]});const sv=localStorage.getItem('rc-vol');if(sv)$('cv').value=sv}catch(e){}\n$('calcs').oninput=calcAll;$('bal').oninput=calcAll;\nfunction syncCur(){['alk','ca','mg'].forEach(k=>{const v=$('i_'+k).value;$('c_'+k).value=v;$('bl_'+k).value=v});calcAll()}\n['alk','ca','mg'].forEach(k=>$('i_'+k).addEventListener('input',syncCur));\n$('calcs').onchange=()=>{try{const sp={};Object.keys(PR).forEach(k=>sp[k]=+$('p_'+k).value);localStorage.setItem('rc-prod',JSON.stringify(sp))}catch(e){}calcAll()};\n$('cv').oninput=()=>{try{loc earance:textfield;appearance:textfield;text-align:center;padding-left:6px;padding-right:6px}.dm input::-webkit-outer-spin-button,.dm input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.lb select{text-overflow:ellipsis}\n#lchart{color:var(--tx)}#lchart svg{width:100%;height:auto;display:block}.ch{font-weight:600;margin:4px 0 6px}.lg{display:grid;gap:4px;font-size:13px;margin-top:8px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}#lchart p{margin:8px 0 0;color:var(--mu);font-size:13px}\n.lb textarea{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:12px/1.4 ui-monospace,monospace;resize:vertical}.lb .row .btn{min-width:0}\n.ph{margin:0 0 16px}.ph h3{font:800 17px \"Bricolage Grotesque\",Figtree,sans-serif;margin:0 0 6px}.ph .w{overflow-x:auto}.ph table{width:100%;border-collapse:collapse;font-size:14px}.ph th,.ph td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln)}.ph th{color:var(--mu);font-weight:600}.ph td:nth-child(2){font-weight:600}.ph p{color:var(--mu);font-size:13px;margin:8px 0 0}\n.vl{margin:2px 0 8px}.vt{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--ln);background:var(--bg);border-radius:99px;padding:2px 3px 2px 12px;margin:0 6px 6px 0;font-size:14px}.vx{border:0;background:none;color:var(--mu);font:600 18px/1 Figtree,sans-serif;cursor:pointer;padding:3px 9px;border-radius:99px}.vnone{color:var(--mu);font-size:13px}\n.vadd{display:flex;gap:8px}.vadd input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}.vadd .btn{flex:none;padding:9px 18px}.vadd input:focus-visible,.vx:focus-visible{outline:3px solid var(--ac);outline-offset:2px}\n.vcount{display:block;font-size:12px;color:var(--mu);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\nfooter{color:var(--mu);font-size:13px;text-align:center;padding:24px 16px 32px}\n@media(prefers-reduced-motion:no-preference){dialog[open]{animation:up .25s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003ca href=\"index.html\" style=\"display:inline-block;margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ac);text-decoration:none\">← Reef Tools home\u003c/a>\n\u003ca href=\"how-to-use.html\" style=\"display:inline-block;margin:0 0 4px 14px;font-size:13px;font-weight:600;color:var(--ac);text-decoration:none\">How to use\u003c/a>\n\u003ch1>Reef \u003cspan>Coral\u003c/span> Guide\u003c/h1>\n\u003cinput id=\"q\" type=\"search\" placeholder=\"Search corals\" aria-label=\"Search corals\">\n\u003cdiv class=\"chips\" id=\"chips\" role=\"group\" aria-label=\"Filter\">\u003c/div>\u003ca class=\"chip\" data-x href=\"reef-water-tracker.html\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:8px;text-decoration:none;color:var(--ac);border-color:var(--ac)\">Reef Water Tracker →\u003c/a>\n\u003c/header>\n\u003cmain>\u003cdetails class=\"lt\" id=\"ltd\">\u003csummary>My lighting: \u003cspan id=\"lsum\">None selected\u003c/span>\u003c/summary>\u003cdiv class=\"lb\">\u003clabel>Light\u003cselect id=\"ls\">\u003c/select>\u003c/label>\u003clabel id=\"lnw\">Number of lights\u003cselect id=\"ln\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>4\u003c/option>\u003coption>5\u003c/option>\u003coption>6\u003c/option>\u003coption>7\u003c/option>\u003coption>8\u003c/option>\u003coption>9\u003c/option>\u003coption>10\u003c/option>\u003coption>11\u003c/option>\u003coption>12\u003c/option>\u003c/select>\u003c/label>\u003clabel id=\"lpw\">Intensity \u003cspan id=\"lv\">100%\u003c/span>\u003cinput id=\"lp\" type=\"range\" min=\"10\" max=\"150\" step=\"5\" value=\"100\">\u003c/label>\u003clabel id=\"lw\" hidden>Surface PAR from your meter (µmol/m²/s)\u003cinput id=\"lm\" type=\"number\" min=\"10\" max=\"1500\" value=\"300\">\u003c/label>\u003clabel>Tank size\u003cselect id=\"lts\">\u003c/select>\u003c/label>\u003cdiv class=\"dm\">\u003clabel>Length (cm)\u003cinput id=\"ll\" type=\"number\" min=\"20\" max=\"300\">\u003c/label>\u003clabel>Width (cm)\u003cinput id=\"lwd\" type=\"number\" min=\"20\" max=\"200\">\u003c/label>\u003clabel>Depth (cm)\u003cinput id=\"lc\" type=\"number\" min=\"20\" max=\"120\">\u003c/label>\u003c/div>\u003cp id=\"lnote\">\u003c/p>\u003cp id=\"lh\">\u003c/p>\u003cbutton type=\"button\" class=\"btn\" id=\"lrec\" hidden>Set number of lights to recommended\u003c/button>\u003cdiv id=\"lchart\">\u003c/div>\u003cp>Surface PAR for each light is a rough estimate for one fixture at 100%. Settings above 100% only apply to lights that allow overdrive. Extra fixtures are assumed to add about half their output where beams overlap, and they also widen the lit area. Recommended light counts use rough coverage estimates for each fixture. Height, lens, tank size and settings change it a lot, so use a PAR meter if you can and choose Custom.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"lt\" id=\"dat\">\u003csummary>My saved data\u003c/summary>\u003cdiv class=\"lb\">\u003cp id=\"dst\">Your selections save automatically on this device.\u003c/p>\u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn p\" id=\"dsv\">Save now\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"dcp\">Copy backup\u003c/button>\u003c/div>\u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"ddl\">Download backup file\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"drs\">Restore backup\u003c/button>\u003c/div>\u003cdiv>\u003cp>Firefox cannot save to a file automatically. If it clears its data when it closes, press this to download a copy of this page with your selections built in, then replace your reef-coral-guide.html with it. You can also stop Firefox clearing data under Settings > Privacy &amp; Security > Cookies and Site Data (untick Delete cookies and site data when Firefox is closed).\u003c/p>\u003cbutton type=\"button\" class=\"btn\" id=\"dem\">Download page with my selections\u003c/button>\u003c/div>\u003cdiv id=\"dfr\">\u003cp>On a computer, Chrome and Edge can save automatically to a file you choose. This keeps your data even if the browser clears its storage. Create a file once, then use Open save file next time.\u003c/p>\u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"dfc\">Create save file\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"dfo\">Open save file\u003c/button>\u003c/div>\u003c/div>\u003cbutton type=\"button\" class=\"btn\" id=\"dre\" hidden>Reconnect save file\u003c/button>\u003ctextarea id=\"dtx\" rows=\"3\" placeholder=\"A backup code appears here. To restore, paste a backup code here and press Restore backup, or press Restore backup to choose a file.\" aria-label=\"Backup code\">\u003c/textarea>\u003cinput type=\"file\" id=\"dfl\" accept=\"application/json,.json\" hidden>\u003cp>Saved: owned corals, saved corals, your light, number of lights, intensity and tank size.\u003c/p>\u003c/div>\u003c/details>\u003cdiv class=\"grid\" id=\"grid\">\u003c/div>\u003cdiv class=\"empty\" id=\"empty\" hidden>No corals match. Try another search or filter.\u003c/div>\u003c/main>\n\u003cfooter>Illustrations are stylised placeholders, not photographs. Add your own photo to any coral from its details; photos stay in this browser. Care notes are general guidance for typical reef tanks.\u003cbr>© 2026 Peter Ede\u003c/footer>\n\u003cdialog id=\"dlg\">\u003c/dialog>\n\u003cscript type=\"application/json\" id=\"emb\">\u003c/script>\n\u003cscript>\n// name, scientific, group, form, color1, color2, care, light, flow, feeding, behaviour, placement, tip\nvar C=[\n[\"Green star polyps\",\"Briareum / Pachyclavularia\",\"Soft\",\"mat\",\"#19c37d\",\"#c8ff5a\",\"Beginner\",\"Low–Medium\",\"Medium\",\"Photosynthetic; optional fine foods\",\"Peaceful, but spreads fast\",\"Rockwork or a frag plug on its own island\",\"Grows over anything it touches. Give it a bare rock to encrust.\"],\n[\"Zoanthids\",\"Zoanthus spp.\",\"Soft\",\"mat\",\"#ff7a1a\",\"#2ee6d6\",\"Beginner\",\"Medium\",\"Low–Medium\",\"Photosynthetic; occasional meaty foods\",\"Semi-aggressive; some zoanthids can carry palytoxin\",\"Mid to low rockwork, away from other coral\",\"Some zoanthids, especially Palythoa, can carry palytoxin. Wear gloves and eye protection when handling or fragging, keep cuts covered, and keep your hands away from your face. Never boil, scrape or burn dry colonies.\"],\n[\"Mushroom coral\",\"Discosoma / Rhodactis\",\"Soft\",\"mush\",\"#7a3cff\",\"#ff4fa3\",\"Beginner\",\"Low\",\"Low\",\"Photosynthetic; accepts small foods\",\"Peaceful; can reproduce quickly\",\"Low-flow shaded spots on the rockwork\",\"Fading colour usually means too much light. Move it lower.\"],\n[\"Toadstool leather\",\"Sarcophyton\",\"Soft\",\"leather\",\"#c9a26b\",\"#f2e2b5\",\"Beginner\",\"Medium\",\"Medium\",\"Photosynthetic\",\"Releases chemicals; keep space around it\",\"Mid to upper rockwork\",\"It sheds a waxy film every few weeks. This is normal.\"],\n[\"Kenya tree\",\"Capnella\",\"Soft\",\"tree\",\"#d7a98c\",\"#ffd9bf\",\"Beginner\",\"Low–Medium\",\"Medium–High\",\"Photosynthetic\",\"Peaceful; drops branches that root\",\"Anywhere with good flow\",\"Easy to share: a dropped branch can be glued to a plug.\"],\n[\"Xenia\",\"Xenia / Anthelia\",\"Soft\",\"tent\",\"#e8e0ff\",\"#9fb5ff\",\"Intermediate\",\"Medium\",\"Medium\",\"Photosynthetic\",\"Peaceful, but can overrun a tank\",\"Isolated rock or its own corner\",\"Pulsing is a fun feature. Keep it contained.\"],\n[\"Hammer coral\",\"Euphyllia ancora\",\"LPS\",\"tent\",\"#2fe0b8\",\"#ffe14a\",\"Beginner\",\"Medium\",\"Medium\",\"Photosynthetic; feed meaty foods weekly\",\"Sweeper tentacles sting neighbours\",\"Sandbed or low rock with 10 cm spacing\",\"Move it carefully by the base. Handling the tentacles can tear them.\"],\n[\"Torch coral\",\"Euphyllia glabrescens\",\"LPS\",\"tent\",\"#7cff6e\",\"#ff9de0\",\"Intermediate\",\"Medium\",\"Medium\",\"Photosynthetic; target feed weekly\",\"Aggressive sweeper tentacles\",\"Sandbed or low rock, away from others\",\"Use extra spacing; Euphyllia species sting one another.\"],\n[\"Frogspawn\",\"Euphyllia divisa\",\"LPS\",\"bubble\",\"#47d7ff\",\"#d0ff5e\",\"Beginner\",\"Medium\",\"Medium\",\"Photosynthetic; occasional meaty foods\",\"Aggressive; long sweepers\",\"Mid rockwork or sandbed\",\"Tentacles retracting often points to poor water quality.\"],\n[\"Acan lord\",\"Acanthastrea lordhowensis\",\"LPS\",\"brain\",\"#ff3d4f\",\"#31d9ff\",\"Beginner\",\"Low–Medium\",\"Low–Medium\",\"Photosynthetic; likes target feeding\",\"Semi-aggressive\",\"Lower rockwork or sandbed\",\"Acans love food. Target feed twice a week for best colour.\"],\n[\"Duncan coral\",\"Duncanopsammia axifuga\",\"LPS\",\"tent\",\"#c8b3ff\",\"#fff3a8\",\"Beginner\",\"Low–Medium\",\"Low–Medium\",\"Needs regular feeding\",\"Peaceful\",\"Mid rockwork, low flow\",\"Feed with mysis or similar so polyps stay full.\"],\n[\"Bubble coral\",\"Plerogyra sinuosa\",\"LPS\",\"bubble\",\"#9dffd0\",\"#ffffff\",\"Intermediate\",\"Low–Medium\",\"Low\",\"Photosynthetic; occasional foods\",\"Semi-aggressive sweepers at night\",\"Low rock or sandbed, gentle flow\",\"Never place in strong flow. The bubbles tear easily.\"],\n[\"Candy cane\",\"Caulastrea furcata\",\"LPS\",\"tent\",\"#32e6a8\",\"#ff7ab8\",\"Beginner\",\"Medium\",\"Medium\",\"Photosynthetic; feed lightly\",\"Peaceful\",\"Mid rockwork\",\"Forgiving and hardy, a good first stony coral.\"],\n[\"Blastomussa\",\"Blastomussa wellsi\",\"LPS\",\"brain\",\"#ff5eb0\",\"#47e8ff\",\"Beginner\",\"Low–Medium\",\"Low–Medium\",\"Photosynthetic; accepts small foods\",\"Peaceful\",\"Shaded, low rock\",\"Colourful in dimmer parts of the tank.\"],\n[\"Lobophyllia\",\"Lobophyllia hemprichii\",\"LPS\",\"brain\",\"#ff8a2b\",\"#27d98c\",\"Beginner\",\"Low–Medium\",\"Low\",\"Photosynthetic; target feed regularly\",\"Semi-aggressive; large flesh\",\"Sandbed or low rock\",\"Heavy; support its weight so it cannot topple onto neighbours.\"],\n[\"Acropora (table/tenuis)\",\"Acropora tenuis\",\"SPS\",\"branch\",\"#ff4fa8\",\"#3be0ff\",\"Advanced\",\"High\",\"High\",\"Photosynthetic; takes fine foods\",\"Semi-aggressive\",\"Upper rockwork, strong random flow\",\"Needs stable alkalinity, calcium and magnesium. Test regularly.\"],\n[\"Montipora capricornis\",\"Montipora capricornis\",\"SPS\",\"plate\",\"#a24bff\",\"#4dffb0\",\"Intermediate\",\"Medium–High\",\"Medium–High\",\"Photosynthetic\",\"Peaceful\",\"Mid to upper rock; allow room to spread\",\"A good first SPS. Plate edges show growth as a bright rim.\"],\n[\"Pink stylophora\",\"Stylophora pistillata\",\"SPS\",\"branch\",\"#ff7ec0\",\"#ffe3f2\",\"Intermediate\",\"High\",\"High\",\"Photosynthetic\",\"Peaceful\",\"Upper rockwork\",\"Stable parameters matter more than anything else.\"],\n[\"Birdsnest\",\"Seriatopora hystrix\",\"SPS\",\"branch\",\"#ffd24a\",\"#ff4fa0\",\"Intermediate\",\"Medium–High\",\"Medium–High\",\"Photosynthetic\",\"Peaceful\",\"Upper to mid rockwork\",\"The most forgiving branching SPS for stepping up from LPS.\"],\n[\"Montipora digitata\",\"Montipora digitata\",\"SPS\",\"branch\",\"#30e0a0\",\"#e9ff6a\",\"Intermediate\",\"Medium–High\",\"Medium–High\",\"Photosynthetic\",\"Peaceful\",\"Upper rockwork\",\"Fast grower. Fragging is simple with a bone cutter.\"],\n[\"Goniopora (flowerpot)\",\"Goniopora spp.\",\"LPS\",\"tent\",\"#e8574c\",\"#9dffb0\",\"Advanced\",\"Medium\",\"Low–Medium\",\"Needs frequent target feeding of small foods such as phytoplankton\",\"Semi-aggressive; long polyps sting nearby corals\",\"Sandbed or low rock, gentle flow\",\"Often declines in captivity. Buy only fully open, healthy colonies and feed it regularly. Receding flesh or brown jelly means act quickly.\"],\n[\"Sinularia (finger leather)\",\"Sinularia spp.\",\"Soft\",\"leather\",\"#cdb98a\",\"#fff0c0\",\"Beginner\",\"Medium–High\",\"Medium–High\",\"Photosynthetic\",\"Releases chemicals; keep space from neighbours\",\"Mid to upper rockwork\",\"Grows quickly and sheds a waxy film every few weeks, which is normal. Run activated carbon and prune it before it shades other corals.\"],\n[\"Clove polyp\",\"Clavularia spp.\",\"Soft\",\"mat\",\"#b48cff\",\"#e9ff6a\",\"Beginner\",\"Low–Medium\",\"Medium\",\"Photosynthetic; accepts fine foods\",\"Peaceful, but spreads over rock\",\"Lower to mid rockwork on its own patch\",\"Spreads as a mat across rock. Keep it away from corals you don’t want covered, and trim runners to control it.\"],\n[\"Colt coral\",\"Cladiella spp.\",\"Soft\",\"leather\",\"#e8c9a0\",\"#fff2d6\",\"Beginner\",\"Medium\",\"Medium–High\",\"Photosynthetic\",\"Releases chemicals; keep space from neighbours\",\"Mid to upper rockwork\",\"Grows fast and closes up for a few days while it sheds a waxy film, which is normal. Run activated carbon and prune it before it shades other corals.\"],\n[\"Ricordea\",\"Ricordea florida / yuma\",\"Soft\",\"mush\",\"#2fd6a0\",\"#ff7a3d\",\"Beginner\",\"Low–Medium\",\"Low–Medium\",\"Photosynthetic; accepts small foods\",\"Peaceful; spreads slowly\",\"Low to mid rockwork in gentle flow\",\"Slow growing and best left in one spot. Strong flow or very bright light makes it shrink or detach, so keep it low in the tank. Frag it by cutting through the base.\"],\n[\"Broccoli coral (Nephthea)\",\"Nephthea spp.\",\"Soft\",\"tree\",\"#d9a0e8\",\"#ffe6a8\",\"Advanced\",\"Medium–High\",\"High\",\"Needs regular feeding with phytoplankton or other fine foods\",\"Releases chemicals; keep space from neighbours\",\"Upper rockwork with strong, even flow\",\"Looks like a small bushy tree. It often declines if underfed, so choose a firm, fully extended colony and feed fine foods often. Run activated carbon.\"],\n[\"Gorgonian (photosynthetic)\",\"Pseudopterogorgia / Eunicea / Muricea spp.\",\"Soft\",\"fan\",\"#b06ad8\",\"#ffd36e\",\"Intermediate\",\"Medium\",\"High\",\"Photosynthetic; accepts fine foods\",\"Peaceful\",\"Upper to mid rockwork in strong, even flow\",\"Buy only photosynthetic species, because non-photosynthetic sea fans are very hard to feed and usually starve. Mount it firmly with open space around it, and keep it under water when you move it.\"],\n[\"Devil’s hand leather\",\"Lobophytum spp.\",\"Soft\",\"leather\",\"#c4a57a\",\"#fbe9bf\",\"Beginner\",\"Medium\",\"Medium\",\"Photosynthetic\",\"Releases chemicals; keep space from neighbours\",\"Mid rockwork on a stable base\",\"Hardy and fairly fast growing. It may stay closed for a few days while it sheds a waxy film. Run activated carbon and keep it away from SPS.\"],\n[\"Elegance coral\",\"Catalaphyllia jardinei\",\"LPS\",\"tent\",\"#3fe0a5\",\"#e86fff\",\"Intermediate\",\"Low–Medium\",\"Low–Medium\",\"Photosynthetic; feed meaty foods weekly\",\"Semi-aggressive; long sweeper tentacles\",\"Sandbed or low rock, away from other corals\",\"Easily damaged, so place it where it can’t be knocked or blasted by flow, and never lift it by the tentacles. Wilting or receding tissue is an early warning sign.\"],\n[\"Plate coral (Fungia)\",\"Fungia spp.\",\"LPS\",\"mush\",\"#8fe04a\",\"#ff6a3d\",\"Beginner\",\"Low–Medium\",\"Low–Medium\",\"Photosynthetic; feed meaty foods weekly\",\"Semi-aggressive; can sting neighbours and may move\",\"Sandbed, away from the rock edges\",\"A free-living coral that sits on sand and can slide around, stinging whatever it touches. Support the whole plate when you lift it, and keep it away from pump intakes and overflows.\"],\n[\"Open brain coral\",\"Trachyphyllia geoffroyi / Wellsophyllia\",\"LPS\",\"brain\",\"#ff4fa3\",\"#8cff5e\",\"Intermediate\",\"Low–Medium\",\"Low\",\"Photosynthetic; target feed meaty foods weekly\",\"Semi-aggressive; sweeper tentacles at night\",\"Sandbed or low rock\",\"Its fleshy tissue tears easily on sharp rock, so place it on sand in gentle flow and check the underside now and then. Lift it from underneath, never by the tissue.\"],\n[\"Favia / Favites (moon coral)\",\"Favia / Favites spp.\",\"LPS\",\"brain\",\"#4fe08a\",\"#ff7a45\",\"Beginner\",\"Medium\",\"Medium\",\"Photosynthetic; target feed lightly\",\"Semi-aggressive; sweeper tentacles at night\",\"Mid rockwork with a gap to neighbours\",\"Hardy and slow growing. Short sweepers come out at night, so leave a clear gap. Good water quality and moderate light are usually all it needs.\"],\n[\"Scolymia\",\"Scolymia spp.\",\"LPS\",\"brain\",\"#ff8f2a\",\"#3ff0c8\",\"Intermediate\",\"Low–Medium\",\"Low\",\"Photosynthetic; target feed meaty foods weekly\",\"Semi-aggressive; sweeper tentacles at night\",\"Sandbed or low rock\",\"A single large, fleshy polyp that does best in gentle flow and low to moderate light. It benefits from regular target feeding.\"],\n[\"Galaxea (starburst)\",\"Galaxea fascicularis\",\"LPS\",\"tent\",\"#7dff4a\",\"#4fd5ff\",\"Beginner\",\"Medium\",\"Medium–High\",\"Photosynthetic; occasional meaty foods\",\"Aggressive; very long sweeper tentacles\",\"Mid to upper rockwork, well away from other corals\",\"Its sweeper tentacles can reach about 15 cm (6 in) at night and sting anything they touch. It grows quickly, so leave room and trim colonies that spread.\"],\n[\"Alveopora (daisy coral)\",\"Alveopora spp.\",\"LPS\",\"tent\",\"#f4c14a\",\"#ff5fa0\",\"Intermediate\",\"Medium\",\"Medium\",\"Photosynthetic; feed fine foods several times a week\",\"Mild; long polyps can touch neighbours\",\"Sandbed or low rock, gentle flow\",\"Related to Goniopora but usually hardier. Its long polyps sway in the flow, so give it room. Closed polyps for several days mean you should check water quality and feeding.\"],\n[\"Chalice coral\",\"Echinophyllia / Oxypora / Mycedium spp.\",\"LPS\",\"plate\",\"#c13cff\",\"#ffe14a\",\"Intermediate\",\"Low–Medium\",\"Low–Medium\",\"Photosynthetic; occasional meaty foods\",\"Semi-aggressive; can sting neighbours\",\"Mid to lower rockwork, gentle to moderate flow\",\"Grows as a spreading plate or scroll. Too much light fades the colour, so keep it low to mid in the tank, with a gap so it can spread without touching neighbours.\"],\n[\"Yellow scroll (Turbinaria)\",\"Turbinaria reniformis / peltata\",\"LPS\",\"plate\",\"#d8d03a\",\"#7cffb2\",\"Intermediate\",\"Medium\",\"Medium\",\"Photosynthetic; accepts fine foods\",\"Peaceful, but shades neighbours as it grows\",\"Mid rockwork with room to spread\",\"Grows in wide scrolls or plates. Once placed it prefers to be left alone. Keep the area below it clear, or it will shade corals that need light.\"],\n[\"Acropora (millepora)\",\"Acropora millepora\",\"SPS\",\"branch\",\"#35e0ff\",\"#ff4fb0\",\"Advanced\",\"High\",\"High\",\"Photosynthetic; takes fine foods\",\"Semi-aggressive\",\"Upper rockwork\",\"Colourful and fast growing, but very sensitive to swings in alkalinity and temperature. Start with a small frag and dip new colonies to catch pests. Quick tissue loss means test your water at once.\"],\n[\"Pocillopora (cauliflower coral)\",\"Pocillopora damicornis\",\"SPS\",\"branch\",\"#ff9fd0\",\"#fff5a8\",\"Intermediate\",\"Medium–High\",\"High\",\"Photosynthetic; takes fine foods\",\"Semi-aggressive\",\"Upper to mid rockwork\",\"Compact, bushy colonies that are usually hardier than Acropora. Needs strong flow and stable water. It grows quickly and can crowd neighbours.\"],\n[\"Montipora (encrusting / plating)\",\"Montipora spp.\",\"SPS\",\"plate\",\"#5a6bff\",\"#ffb347\",\"Intermediate\",\"Medium\",\"Medium–High\",\"Photosynthetic\",\"Peaceful\",\"Mid to upper rockwork\",\"Often the most forgiving SPS to start with. It grows as a thin sheet or plate and can spread across rock, so keep it trimmed back from neighbours.\"],\n[\"Porites (finger / branching)\",\"Porites spp.\",\"SPS\",\"branch\",\"#e8c84a\",\"#c47bff\",\"Intermediate\",\"Medium–High\",\"Medium–High\",\"Photosynthetic; accepts fine foods\",\"Peaceful\",\"Mid to upp
