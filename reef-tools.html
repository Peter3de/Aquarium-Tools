\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"description\" content=\"How to use the Reef Water Tracker, the Reef Water Chemistry page and the Reef Coral Guide.\">\n\u003cmeta name=\"theme-color\" content=\"#eaf6f8\" media=\"(prefers-color-scheme: light)\">\n\u003cmeta name=\"theme-color\" content=\"#08162b\" media=\"(prefers-color-scheme: dark)\">\n\u003clink rel=\"icon\" href=\"data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230b2540'/%3E%3Cg%20stroke='%23ff6fae'%20stroke-width='6'%20stroke-linecap='round'%20fill='none'%3E%3Cpath%20d='M32%2054V30M32%2040L18%2026M32%2036L46%2020M18%2026V16M46%2020V12'/%3E%3C/g%3E%3C/svg%3E\">\n\u003ctitle>How to use Reef Tools\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#eaf6f8;--sf:#fff;--tx:#0b2540;--mu:#51708f;--ac:#d6226f;--ln:#c4dce3;--ok:#17703f;--low:#1c5fb0;--high:#b5540a;--bad:#a8281b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root{--bg:#08162b;--sf:#0f2444;--tx:#e6f1ff;--mu:#8fa8c7;--ac:#ff6fae;--ln:#1d3a63;--ok:#6fd89b;--low:#7db4ff;--high:#ffa45c;--bad:#ff8f80;color-scheme:dark}}\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 Figtree,system-ui,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:28px 16px 40px}\na{color:var(--ac);font-weight:600}\na:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}\nh1{font:800 32px/1.1 \"Bricolage Grotesque\",Figtree,sans-serif;margin:10px 0 6px;letter-spacing:-.01em}\nh1 span{color:var(--ac)}\n.sub{color:var(--mu);margin:0 0 22px}\n.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}\n.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 14px;font-size:14px;text-decoration:none;color:var(--ac)}\ndetails{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin:0 0 12px}\nsummary{padding:13px 16px;cursor:pointer;font:800 18px \"Bricolage Grotesque\",Figtree,sans-serif}\nsummary h2{display:inline;font:inherit;margin:0}\n.b{padding:0 16px 14px}\n.b h3{font:800 16px \"Bricolage Grotesque\",Figtree,sans-serif;margin:16px 0 4px}\n.b p{margin:6px 0}\n.b ul,.b ol{margin:6px 0;padding-left:22px}\n.b li{margin:3px 0}\n.ok{color:var(--ok);font-weight:700}.low{color:var(--low);font-weight:700}.high{color:var(--high);font-weight:700}.ext{color:var(--bad);font-weight:700}\n.note{color:var(--mu);font-size:14px}\nfooter{color:var(--mu);font-size:13px;margin-top:24px}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003cp>\u003ca href=\"index.html\">← Reef Tools\u003c/a>\u003c/p>\n\u003ch1>How to \u003cspan>use\u003c/span> these tools\u003c/h1>\n\u003cp class=\"sub\">Three pages that work together: the Reef Water Tracker checks your test results, Reef Water Chemistry explains how calcium, magnesium and alkalinity work together and works out doses, and the Reef Coral Guide helps you choose and place corals.\u003c/p>\n\u003cdiv class=\"nav\">\u003ca class=\"chip\" href=\"#start\">Quick start\u003c/a>\u003ca class=\"chip\" href=\"#tracker\">Water Tracker\u003c/a>\u003ca class=\"chip\" href=\"#chemistry\">Water Chemistry\u003c/a>\u003ca class=\"chip\" href=\"#guide\">Coral Guide\u003c/a>\u003ca class=\"chip\" href=\"#data\">Your data\u003c/a>\u003c/div>\n\n\u003cdetails id=\"start\" open>\u003csummary>\u003ch2>Quick start\u003c/h2>\u003c/summary>\u003cdiv class=\"b\">\u003col>\n\u003cli>Open the \u003ca href=\"reef-water-tracker.html\">Reef Water Tracker\u003c/a> and choose the coral group that matches your tank.\u003c/li>\n\u003cli>Check your tank size and type in your latest test results.\u003c/li>\n\u003cli>Follow the numbered list under \u003cb>What to do\u003c/b>, starting at number 1.\u003c/li>\n\u003cli>Select \u003cb>Save to log\u003c/b> so the tracker can learn how fast your tank uses calcium, alkalinity and magnesium.\u003c/li>\n\u003cli>Open \u003ca href=\"reef-water-chemistry.html\">Reef Water Chemistry\u003c/a> to see how calcium, magnesium and alkalinity interact, and to work out doses for the products you use.\u003c/li>\n\u003cli>Use the \u003ca href=\"reef-coral-guide.html\">Reef Coral Guide\u003c/a> to see which corals suit your lighting and water.\u003c/li>\u003c/ol>\u003c/div>\u003c/details>\n\n\u003cdetails id=\"tracker\">\u003csummary>\u003ch2>Reef Water Tracker\u003c/h2>\u003c/summary>\u003cdiv class=\"b\">\n\u003ch3>1. Choose your coral group\u003c/h3>\n\u003cp>Use the chips at the top. \u003cb>Mixed reef\u003c/b> uses the narrowest overlap of the Soft, LPS and SPS ranges, so it suits tanks with all three. \u003cb>Soft corals\u003c/b>, \u003cb>LPS\u003c/b> and \u003cb>SPS\u003c/b> use the ranges from the Reef Coral Guide. \u003cb>Fish only\u003c/b> is for fish and live rock without corals.\u003c/p>\n\u003ch3>2. Enter your tank\u003c/h3>\n\u003cul>\u003cli>Pick a \u003cb>Tank size\u003c/b> from the list, or type your own Length, Width and Depth in centimetres. The list switches to Custom size if your numbers don’t match a preset.\u003c/li>\n\u003cli>Add any \u003cb>sump or extra water\u003c/b> in litres.\u003c/li>\n\u003cli>If you know your real system volume, type it in \u003cb>total litres\u003c/b>. This overrides the size above.\u003c/li>\n\u003cli>The working volume is the tank volume less a flat 10% for rock and sand, plus any sump. Dosing amounts are based on it.\u003c/li>\u003c/ul>\n\u003ch3>3. Enter your test results\u003c/h3>\n\u003cp>Fill in any readings you have. You don’t need all of them. Set the \u003cb>test date\u003c/b>, and choose \u003cb>ppt\u003c/b> or \u003cb>SG\u003c/b> beside salinity. Changing the unit converts what you’ve typed. The tracker opens with your last saved readings already filled in, so just change the ones you’ve retested.\u003c/p>\n\u003ch3>4. Read the status\u003c/h3>\n\u003cul>\u003cli>\u003cspan class=\"ok\">In range\u003c/span>: inside the ideal range. Leave it alone.\u003c/li>\n\u003cli>\u003cspan class=\"low\">Low\u003c/span> or \u003cspan class=\"high\">High\u003c/span>: outside ideal but within what the coral tolerates.\u003c/li>\n\u003cli>\u003cspan class=\"ext\">Very low\u003c/span> or \u003cspan class=\"ext\">Very high\u003c/span>: outside the tolerated range. The box turns red.\u003c/li>\u003c/ul>\n\u003cp class=\"note\">Ideal is where to aim. Tolerated is what corals can survive for short periods.\u003c/p>\n\u003ch3>5. Follow “What to do”\u003c/h3>\n\u003cp>Problems are listed in priority order: ammonia and nitrite first, then temperature, salinity, magnesium, alkalinity, calcium, pH, nitrate and phosphate. Readings outside the tolerated range come before milder ones. Work from the top, and fix magnesium before calcium and alkalinity, because low magnesium stops them holding.\u003c/p>\n\u003cul>\u003cli>Dose amounts are the pure chemical (sodium bicarbonate for alkalinity, calcium chloride for calcium, magnesium chloride for magnesium, all food grade or laboratory grade). For commercial products, follow the label, or use the \u003ca href=\"reef-water-chemistry.html\">Reef Water Chemistry\u003c/a> calculators, which include Red Sea and Seachem products.\u003c/li>\n\u003cli>Large corrections are split over several days. The tracker never suggests raising alkalinity by more than 1 dKH, calcium by more than 20 ppm, or magnesium by more than 50 ppm in a day. Change salinity by no more than 1 ppt (0.001 SG) and temperature by no more than 1 °C per day.\u003c/li>\n\u003cli>Retest 24 hours after each dose before dosing again.\u003c/li>\u003c/ul>\n\u003ch3>6. Save to the log\u003c/h3>\n\u003cp>Select \u003cb>Save to log\u003c/b> to keep the readings. Saving again on the same date replaces that entry. Open \u003cb>My log\u003c/b> to see every entry with all ten parameters, and use \u003cb>Delete\u003c/b> to remove one. Use \u003cb>Download backup\u003c/b> there to keep a copy, \u003cb>Restore backup\u003c/b> to load it again, or \u003cb>Export CSV\u003c/b> to open the log in a spreadsheet. After you have two entries, a \u003cb>How often to dose\u003c/b> section estimates daily use and a maintenance dose.\u003c/p>\n\u003cp class=\"note\">The estimate assumes you added nothing between tests. If you did dose, real use is higher.\u003c/p>\n\u003ch3>Suggested testing\u003c/h3>\n\u003cp>Temperature daily. Salinity, alkalinity, calcium and nitrate weekly. Magnesium and phosphate every two weeks. Ammonia and nitrite after any livestock loss or new additions.\u003c/p>\n\u003cp>The \u003cb>Coral Guide\u003c/b> chip at the top opens the guide filtered to your chosen group.\u003c/p>\n\u003c/div>\u003c/details>\n\n\u003cdetails id=\"chemistry\">\u003csummary>\u003ch2>Reef Water Chemistry\u003c/h2>\u003c/summary>\u003cdiv class=\"b\">\n\u003cp>Salinity, magnesium, alkalinity, calcium and pH affect each other. This page shows how, checks your readings and works out how much of each product to add. Use the \u003ca href=\"reef-water-tracker.html\">Reef Water Tracker\u003c/a> to keep a log of your results.\u003c/p>\n\u003ch3>1. Choose your coral group\u003c/h3>\n\u003cp>Use the chips at the top: \u003cb>Mixed reef\u003c/b>, \u003cb>Soft corals\u003c/b>, \u003cb>LPS\u003c/b>, \u003cb>SPS\u003c/b> or \u003cb>Fish only\u003c/b>. They set the ideal ranges and the starting targets for the calculators, and use the same ranges as the Tracker and the Coral Guide.\u003c/p>\n\u003ch3>2. Check my water\u003c/h3>\n\u003cp>Type in any of salinity, magnesium, alkalinity, calcium and pH. You don’t need all five. Each gets an \u003cspan class=\"ok\">In range\u003c/span>, \u003cspan class=\"low\">Low\u003c/span> or \u003cspan class=\"high\">High\u003c/span> status. \u003cb>What to do, in order\u003c/b> lists the fixes in the right sequence: \u003cb>salinity, then magnesium, then alkalinity, then calcium, then pH\u003c/b>. It also warns you about precipitation risk (high calcium with high alkalinity), a low magnesium to calcium ratio, and whether a pH problem looks like low alkalinity or CO₂.\u003c/p>\n\u003cp>If you use the \u003ca href=\"reef-water-tracker.html\">Reef Water Tracker\u003c/a> on the same device, this page fills itself in from it when it opens: your coral group, salinity unit, system litres, and the salinity, pH, alkalinity, calcium and magnesium from your most recent \u003cb>Save to log\u003c/b> entry. It also works out your daily drop for alkalinity, calcium and magnesium from your last two tests, and puts it in the calculators’ \u003cb>Daily drop\u003c/b> boxes. A line above the table shows what was filled in. If you test again, save the new readings in the Tracker and select \u003cb>Fill from Reef Water Tracker\u003c/b> to reload them. You can still type over any value on this page.\u003c/p>\n\u003cp class=\"note\">If you open the pages straight from a folder or drive on your computer, the browser may not share the Tracker’s saved data. In that case use \u003cb>Load from Tracker backup file\u003c/b> and choose the backup (or CSV export) from \u003cb>My log\u003c/b> in the Tracker, or open the pages from a web address.\u003c/p>\n\u003cp>Your alkalinity, calcium and magnesium readings fill in automatically as the \u003cb>Current\u003c/b> values in the calculators below. You can still change them there to try other numbers.\u003c/p>\n\u003ch3>3. How they interact\u003c/h3>\n\u003cp>Short explanations of each parameter: salinity sets the baseline for all the others, magnesium keeps calcium and alkalinity dissolved, alkalinity buffers pH, calcium is the building block, and pH is mostly the result of the rest. Corals use calcium and alkalinity together, about 1 dKH for every 7 ppm of calcium.\u003c/p>\n\u003ch3>4. Calculators: alkalinity, calcium and magnesium\u003c/h3>\n\u003col>\u003cli>Enter your \u003cb>System litres\u003c/b> (tank plus sump) once at the top of the section.\u003c/li>\n\u003cli>In each calculator, check the \u003cb>Current\u003c/b> and \u003cb>Target\u003c/b>. The target starts at the middle of the ideal range for your coral group.\u003c/li>\n\u003cli>Choose your \u003cb>Product\u003c/b>. The list has the common pure chemicals (food-grade or laboratory-grade only, never supermarket, hardware or pool products) plus Red Sea Reef Foundation A, B and C (liquid and powder) and Seachem Reef Builder and Reef Advantage Calcium. Liquids are shown in mL and powders in grams.\u003c/li>\n\u003cli>Set \u003cb>New salt water reads\u003c/b> to what your salt mix measures. It is used when you need to lower a reading with a water change.\u003c/li>\n\u003cli>Optionally enter a \u003cb>Daily drop\u003c/b>, how much you lose per day. The calculator then gives a daily maintenance dose. Your Tracker log estimates this once you have two entries.\u003c/li>\u003c/ol>\n\u003cp>To raise a reading you get the total amount to add, split over several days so it never goes above +1 dKH, +20 ppm calcium or +50 ppm magnesium per day. To lower a reading you get the percentage and litres of water to replace. The calculators also show the matching dose of the other element, so alkalinity and calcium stay balanced.\u003c/p>\n\u003ch3>5. Balance everything to my calcium\u003c/h3>\n\u003cp>Choose the calcium level you want to hold, then enter your current calcium, alkalinity and magnesium. The page sets matching targets: magnesium about 3.07 times calcium, and alkalinity about calcium divided by 60, kept inside the ideal range for your group. A table shows each element’s change and what to do. Work down it in order, with calcium and alkalinity on different days, and retest after each water change.\u003c/p>\n\u003ch3>Saved on your device\u003c/h3>\n\u003cp>Your product choices and system litres are remembered on this device. This page doesn’t keep a log of readings; use the Water Tracker for that.\u003c/p>\n\u003cp class=\"note\">Dose amounts use the manufacturer’s label rates. Always check the label on your own bottle.\u003c/p>\n\u003c/div>\u003c/details>\n\n\u003cdetails id=\"guide\">\u003csummary>\u003ch2>Reef Coral Guide\u003c/h2>\u003c/summary>\u003cdiv class=\"b\">\n\u003ch3>Find corals\u003c/h3>\n\u003cp>Type in the search box to find a coral by name. The chips filter by \u003cb>All\u003c/b>, \u003cb>Owned\u003c/b>, \u003cb>Soft\u003c/b>, \u003cb>LPS\u003c/b>, \u003cb>SPS\u003c/b> and \u003cb>Saved\u003c/b>.\u003c/p>\n\u003ch3>Mark what you keep\u003c/h3>\n\u003cul>\u003cli>Tick the box in the corner of a card to say \u003cb>I own this coral\u003c/b>. The count shows on the Owned chip.\u003c/li>\n\u003cli>Open a coral and select \u003cb>Save coral\u003c/b> to add it to your Saved list.\u003c/li>\n\u003cli>Keep more than one type of the same coral, such as several zoanthid morphs? Open the coral and use \u003cb>My varieties\u003c/b> to add each one by name. Adding a variety marks the coral as owned, and your varieties show on its card and in the search box.\u003c/li>\u003c/ul>\n\u003ch3>Open a coral\u003c/h3>\n\u003cp>Tap a card to see its type, care level, lighting, flow, feeding, behaviour and placement. It also shows suggested position and light for your setup, which corals can sit close and which need a gap, and its ideal and tolerated water parameters. \u003cb>Check my water against these ranges\u003c/b> opens the Water Tracker on that coral’s group.\u003c/p>\n\u003ch3>Add your own photo\u003c/h3>\n\u003cp>Open a coral and select \u003cb>Add my photo\u003c/b>. On a phone you can take a picture or choose one from your library. Your photo replaces the drawing on that coral’s card. Use \u003cb>Change my photo\u003c/b> or \u003cb>Remove photo\u003c/b> to update it. Photos are shrunk to save space.\u003c/p>\n\u003ch3>Set your lighting and tank\u003c/h3>\n\u003cp>Open \u003cb>My lighting\u003c/b>. Choose your light, the number of lights and the intensity. Pick a \u003cb>Tank size\u003c/b> or type the Length, Width and Depth in centimetres. The guide estimates light at different depths so you can place corals where they will get what they need. Choose \u003cb>Custom\u003c/b> and enter a reading from a PAR meter for the most accurate result.\u003c/p>\n\u003cp class=\"note\">Light estimates are rough. Height, lens, tank size and settings change them a lot.\u003c/p>\n\u003c/div>\u003c/details>\n\n\u003cdetails id=\"data\">\u003csummary>\u003ch2>Your data and backups\u003c/h2>\u003c/summary>\u003cdiv class=\"b\">\n\u003cp>All three pages save automatically on the device and browser you used. Nothing you enter is sent anywhere, and there’s no account. The one outside request is the pages loading their typefaces from Google Fonts.\u003c/p>\n\u003cul>\u003cli>A different browser or device starts empty.\u003c/li>\n\u003cli>Clearing your browser’s site data erases your log, tank settings, photos and selections.\u003c/li>\n\u003cli>The Reef Coral Guide has a \u003cb>My saved data\u003c/b> section. Use \u003cb>Download backup file\u003c/b> or \u003cb>Copy backup\u003c/b> to keep a copy of your owned corals, saved corals, varieties, lighting and tank size, and \u003cb>Restore backup\u003c/b> to bring them back. Photos are not part of that backup.\u003c/li>\n\u003cli>The Reef Water Tracker log has its own backup. In \u003cb>My log\u003c/b>, use \u003cb>Download backup\u003c/b> and \u003cb>Restore backup\u003c/b>. Restoring replaces any entries with the same date. Tank settings are not included.\u003c/li>\n\u003cli>The Reef Water Chemistry page remembers only your chosen products and system litres. It has no log or backup.\u003c/li>\n\u003cli>On a computer, Chrome and Edge can also save automatically to a file you choose.\u003c/li>\u003c/ul>\n\u003cp class=\"note\">If you rely on your log, download a backup now and then. Export CSV gives you a copy you can open in a spreadsheet.\u003c/p>\n\u003c/div>\u003c/details>\n\n\u003cfooter>General guidance only, not a substitute for advice from an aquatic professional. Retest after every change and adjust slowly.\u003cbr>© 2026 Peter Ede\u003c/footer>\n\u003c/main>\n\u003cscript>\n// Open the section a link points to, so the contents chips and shared links land on visible text.\nfunction openHash(){var e=location.hash&&document.getElementById(location.hash.slice(1));if(e&&e.tagName==='DETAILS')e.open=true}\ndocument.querySelectorAll('.nav a').forEach(function(a){a.addEventListener('click',function(){var d=document.querySelector(a.getAttribute('href'));if(d)d.open=true})});\naddEventListener('hashchange',openHash);openHash();\n\u003c/script>\u003c/body>\u003c/html>\n"}</script>
<script>
var PG=JSON.parse(document.getElementById('data').textContent);
var VIEWS=[['home','Home'],['tracker','Water Tracker'],['chemistry','Water Chemistry'],['guide','Coral Guide'],['how-to','How to use']];
var MAP={'index':'home','how-to-use':'how-to','reef-water-tracker':'tracker','reef-water-chemistry':'chemistry','reef-coral-guide':'guide'};
var TITLE={home:'Reef Tools','how-to':'How to use Reef Tools',tracker:'Reef Water Tracker',chemistry:'Reef Water Chemistry',guide:'Reef Coral Guide'};
var GROUPS=['soft','lps','sps'];
var frames={},cur='';
var nav=document.getElementById('nav'),stage=document.getElementById('stage');
nav.innerHTML=VIEWS.map(function(v){return '<a href="#'+(v[0]==='home'?'':v[0])+'" data-v="'+v[0]+'">'+v[1]+'</a>'}).join('');
function liveFill(){
 var t=frames.tracker,c=frames.chemistry;if(!t||!c)return;
 try{var tw=t.contentWindow,cw=c.contentWindow;if(tw.__live&&cw.__apply)cw.__apply(tw.__live())}catch(e){}
}
function make(name,hash){
 if(frames[name])frames[name].remove();
 var f=document.createElement('iframe'),html=PG[name];
 f.title=TITLE[name];f.setAttribute('allow','clipboard-write; clipboard-read');
 if(hash)html=html.replace('<head>','<head><script>location.hash='+JSON.stringify(hash)+'<\/script>');
 f.srcdoc=html;
 if(name==='chemistry')f.addEventListener('load',liveFill);
 frames[name]=f;stage.appendChild(f);
}
function show(name,hash){
 if(!PG[name])name='home';
 if(name==='chemistry'||hash||!frames[name])make(name,hash);
 Object.keys(frames).forEach(function(k){frames[k].style.display=k===name?'block':'none'});
 cur=name;document.title=TITLE[name];
 Array.prototype.forEach.call(nav.children,function(a){if(a.dataset.v===name)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
function route(){var n=location.hash.slice(1)||'home';if(n!==cur)show(n)}
addEventListener('hashchange',route);
addEventListener('message',function(e){
 var ok=Object.keys(frames).some(function(k){return frames[k].contentWindow===e.source});
 if(!ok||!e.data)return;
 if(e.data.reefLive)liveFill();
 if(e.data.reefGo){
  var n=MAP[e.data.reefGo];if(!n)return;
  var h=String(e.data.hash||'').replace(/^#/,'').toLowerCase();
  if(GROUPS.indexOf(h)<0||(n!=='tracker'&&n!=='guide'))h='';
  show(n,h);
  var want=n==='home'?'':n;if(location.hash.slice(1)!==want)location.hash=want;
 }
});
route();
</script></body></html>
